// Ombak Combo: tiap tekan tombol menambah meter; makin tinggi meter, makin tinggi ombak. Diam 2,5 dtk = surut.
function combo(b){const now=performance.now();let h=0;
 for(const i of RB){const d=(b[i]||0)>.5;if(d&&!pv[i]){h++;const r=RP[i];if(r)pressFx(r)}pv[i]=d}
 const dt=Math.min(.1,(now-lt)/1000||0);lt=now;
 if(h){meter+=h;last=now}
 meter=Math.max(0,meter-.6*dt);if(now-last>2500)meter=0;
 if(meter>=9&&!big)big=now;if(big&&now-big>1400){meter=0;big=0}
 const tg=meter>=9?1:meter>=6?.65:meter>=3?.35:0;
 K+=(tg-K)*.1;if(!tg&&K<.01)K=0;off=(off+dt*(70+150*K))%420;
 WV.style.opacity=K>0?1:0;if(K>0)WV.setAttribute('transform',`translate(${off} 954) scale(1 ${K}) translate(0 -954)`)}
function demo(t){t%=15000;const b=[],ax=[0,0,0,0];
 if(t<6750)b[RB[Math.floor(t/450)]]=1;
 else if(t<9150){const u=t-6750;b[u<1200?6:7]=Math.sin(Math.PI*(u%1200)/1200)}
 else if(t<13950){const u=t-9150,i=u<2400?0:2,v=u%2400,m=Math.sin(Math.PI*v/2400),a=v/1200*6.283;ax[i]=m*Math.cos(a);ax[i+1]=m*Math.sin(a)}
 return[b,ax]}
// Sentuh (hanya mode preview ?demo)
const TCH=Q.has('demo'),vb=[],vax=[0,0,0,0],ptr=new Map();let tact=-1e9;
if(TCH){const S=$('s'),pt=S.createSVGPoint(),TI={a:0,b:1,x:2,y:3,lb:4,rb:5,view:8,menu:9,du:12,dd:13,dl:14,dr:15,share:17};
 const xy=e=>{pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(S.getScreenCTM().inverse())};
 const rel=p=>{const id=p.id,st=ST[id];if(id in TI)vb[TI[id]]=0;else if(id=='tlg')vb[6]=0;else if(id=='trg')vb[7]=0;
  else if(st){vax[st.ai]=vax[st.ai+1]=0;if(p.m<14){vb[st.bi]=1;setTimeout(()=>vb[st.bi]=0,180)}}};
 const mv=(e,p)=>{const st=ST[p.id];if(!st)return;const q=xy(e);let x=(q.x-st.cx)/90,y=(q.y-st.cy)/90;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}
  p.m=Math.max(p.m,m*90);vax[st.ai]=x;vax[st.ai+1]=y};
 S.addEventListener('pointerdown',e=>{tact=performance.now();const g=e.target.closest('#a,#b,#x,#y,#lb,#rb,#view,#menu,#share,#du,#dd,#dl,#dr,#ls,#rs,#tlg,#trg');if(!g)return;
  e.preventDefault();S.setPointerCapture(e.pointerId);const p={id:g.id,t:tact,m:0};ptr.set(e.pointerId,p);if(g.id in TI)vb[TI[g.id]]=1;mv(e,p)});
 S.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(p){tact=performance.now();mv(e,p)}});
 const up=e=>{const p=ptr.get(e.pointerId);if(!p)return;rel(p);ptr.delete(e.pointerId);tact=performance.now()};
 S.addEventListener('pointerup',up);S.addEventListener('pointercancel',up)}
(function loop(t){
  if(!window.__freeze){
    let p=null;const pads=navigator.getGamepads?navigator.getGamepads():[];
    for(const g of pads){if(!g||!g.connected)continue;if(g.mapping==='standard'){p=g;break}p=p||g}
    if(p)draw(p.buttons.map(x=>x.value||(x.pressed?1:0)),p.axes);
    else if(TCH){const n=performance.now();for(const q of ptr.values()){const v=Math.min(1,(n-q.t)/700);if(q.id=='tlg')vb[6]=v;else if(q.id=='trg')vb[7]=v}
      if(ptr.size||n-tact<5000)draw(vb,vax);else{const[d,a]=demo(t);draw(d,a)}}
    else draw([],[0,0,0,0]);
  }
  requestAnimationFrame(loop)
})(0);
