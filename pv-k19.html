</svg>
<script>
const Q=new URLSearchParams("demo=1"),R=document.documentElement.style;
function mix(h,t,a){const n=parseInt(h,16),c=[n>>16&255,n>>8&255,n&255].map(v=>Math.round(v+(t-v)*a));return'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')}
(function(){let a=(Q.get('accent')||'19e3ff').replace('#','');if(!/^[0-9a-fA-F]{6}$/.test(a))a='19e3ff';
 R.setProperty('--acc','#'+a);R.setProperty('--accHi',mix(a,255,.45));R.setProperty('--accLo',mix(a,0,.35));
 if(/^[0-9a-fA-F]{6}$/.test(Q.get('bg')||''))document.body.style.background='#'+Q.get('bg');})();
const IDX={a:0,b:1,x:2,y:3,lb:4,rb:5,view:8,menu:9,du:12,dd:13,dl:14,dr:15,share:17};
const $=id=>document.getElementById(id),E={};for(const k in IDX)E[k]=$(k);
const YB=62,YT=-150,RG=YB-YT;
const TG={lt:{i:6,p:'tl'},rt:{i:7,p:'tr'}};
for(const k in TG){const t=TG[k],p=t.p;t.m=$(p+'m');t.f=$(p+'f');t.e=$(p+'e');t.k=$(p+'k');t.o=$(p+'o');t.l=$(p+'l');t.cur=0;t.peak=0;t.pt=0;t.txt='';}
const ST={ls:{cx:354.0,cy:418.0,ai:0,bi:10},rs:{cx:976.5,cy:646.5,ai:2,bi:11}};
for(const k in ST){const s=ST[k];s.g=$(k+'c');s.sh=$(k+'s');s.hl=$(k+'h');s.hi=$(k+'i');s.d=$(k+'d');s.k=$(k+'k');s.grad=document.getElementById('g'+k);}
const TRAVEL=32,DZ=.09;
// Trigger fisik jarang mencapai tepat 1.0 (umumnya 0.90-0.99): di atas FULL_AT dianggap penuh
const FULL_AT=.96,T_FLOOR=.02;
function draw(b,ax){
  for(const k in IDX)E[k].classList.toggle('on',(b[IDX[k]]||0)>.5);
  $('dc').classList.toggle('on',!!(b[12]||b[13]||b[14]||b[15]));
  const now=performance.now();
  for(const k in TG){const t=TG[k],raw=Math.min(1,Math.max(0,b[t.i]||0)),
      tg=raw<T_FLOOR?0:raw>=FULL_AT?1:raw;
    t.cur+=(tg-t.cur)*(window.__freeze?1:.4);if(Math.abs(tg-t.cur)<.003)t.cur=tg;
    if(t.cur>=t.peak){t.peak=t.cur;t.pt=now}else if(now-t.pt>600)t.peak=Math.max(t.cur,t.peak-.016);
    const v=t.cur,full=v>=.995,top=YB-RG*v,fy=full?YT-10:top,sh=`translate(0 ${(v*16).toFixed(2)})`;
    t.f.setAttribute('y',fy);t.f.setAttribute('height',v>.004?YB+120-fy:0);   // saat penuh isi dilebihkan 10 unit di atas tepi (di-clip)
    t.e.setAttribute('y',top-2);t.e.style.opacity=(v>.01&&!full)?1:0;
    t.k.setAttribute('y',YB-RG*t.peak-1.5);t.k.style.opacity=0;
    t.m.setAttribute('transform',sh);t.o.setAttribute('transform',sh);   // glow harus ikut turun bersama badan trigger
    t.o.style.opacity=full?1:v*.6;
    t.l.style.fillOpacity=v>.02?.95:.38;}
  for(const k in ST){const s=ST[k];let x=ax[s.ai]||0,y=ax[s.ai+1]||0;const m=Math.hypot(x,y);
    if(m<DZ){x=y=0}else if(m>1){x/=m;y/=m}
    const mg=Math.hypot(x,y),dx=x*TRAVEL,dy=y*TRAVEL,p=(b[s.bi]||0)>.5?1:0,sc=(1+mg*.035)*(p?.93:1);
    s.g.setAttribute('transform',`translate(${s.cx+dx} ${s.cy+dy+p*3}) scale(${sc})`);
    s.sh.setAttribute('transform',`translate(${5-x*7} ${10-y*7})`);
    s.hl.setAttribute('transform',`translate(${-x*7} ${-y*7})`);s.hi.setAttribute('transform',`translate(${x*4} ${y*4})`);
    s.grad.setAttribute('fx',.36-x*.16);s.grad.setAttribute('fy',.3-y*.16);
    s.d.style.opacity=mg*.65;s.k.style.opacity=p;}
}
const PV=Q.has('demo')||Q.has('preview');if(PV)document.body.classList.add('pv');
const NS='http://www.w3.org/2000/svg',svg=$('s');
document.querySelectorAll('.p:not(.arm) .glow').forEach(g=>{const c=g.cloneNode();c.setAttribute('class','rip');g.parentNode.insertBefore(c,g.nextSibling)});
const SG={a:['エー','A'],b:['ビー','B'],x:['エックス','X'],y:['ワイ','Y'],lb:['エルビー','LB'],rb:['アールビー','RB'],lt:['エルティー','LT'],rt:['アールティー','RT'],view:['ビュー','VIEW'],menu:['メニュー','MENU'],du:['上','D-PAD UP'],dd:['下','D-PAD DOWN'],dl:['左','D-PAD LEFT'],dr:['右','D-PAD RIGHT'],share:['シェア','SHARE'],l3:['エル３','L3'],r3:['アール３','R3']};
const SGN=$('sgn'),SJ=$('sj'),SE=$('se'),PS={},KEYS=Object.assign({l3:10,r3:11},IDX);
function show(k){const m=SG[k];SJ.textContent=m[0];SE.textContent=m[1];SGN.classList.remove('fl');void SGN.getBoundingClientRect();SGN.classList.add('fl')}
function post(b,ax){for(const k in KEYS){const on=(b[KEYS[k]]||0)>.5;if(on&&!PS[k])show(k);PS[k]=on}
  for(const[k,i]of[['lt',6],['rt',7]]){const v=b[i]||0;if(v>.5&&!PS[k]){show(k);PS[k]=true}else if(v<.3)PS[k]=false}
}
const TCH={ptr:new Map(),last:-1e9,pl:{}};
function pt(e){return new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse())}
function touchState(now){const b=[],ax=[0,0,0,0];
  TCH.ptr.forEach(o=>{const id=o.id;if(id in IDX)b[IDX[id]]=1;else if(id==='tlg')b[6]=Math.min(1,(now-o.t0)/700);else if(id==='trg')b[7]=Math.min(1,(now-o.t0)/700);else{const s=ST[id];ax[s.ai]=o.dx;ax[s.ai+1]=o.dy}});
  for(const k in ST)if(now<(TCH.pl[k]||0))b[ST[k].bi]=1;return[b,ax]}
if(PV){
  const SEL='#a,#b,#x,#y,#lb,#rb,#view,#menu,#du,#dd,#dl,#dr,#share,#ls,#rs,#tlg,#trg';
  const clr=e=>{const o=TCH.ptr.get(e.pointerId);if(!o)return;TCH.ptr.delete(e.pointerId);const n=performance.now();TCH.last=n;
    if((o.id==='ls'||o.id==='rs')&&Math.hypot(o.dx,o.dy)<.15&&n-o.t0<350)TCH.pl[o.id]=n+180};
  svg.addEventListener('pointerdown',e=>{TCH.last=performance.now();const el=e.target.closest(SEL);if(!el)return;e.preventDefault();
    try{svg.setPointerCapture(e.pointerId)}catch(_){}const p=pt(e);TCH.ptr.set(e.pointerId,{id:el.id,t0:performance.now(),sx:p.x,sy:p.y,dx:0,dy:0})});
  svg.addEventListener('pointermove',e=>{const o=TCH.ptr.get(e.pointerId);if(!o)return;TCH.last=performance.now();
    if(o.id==='ls'||o.id==='rs'){const p=pt(e);let x=(p.x-o.sx)/90,y=(p.y-o.sy)/90;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}o.dx=x;o.dy=y}});
  ['pointerup','pointercancel','lostpointercapture'].forEach(n=>svg.addEventListener(n,clr));
  ['contextmenu','selectstart','dragstart'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
}
// Demo: buttons (Home never pressed) -> LT -> RT -> left stick -> right stick -> rest (sticks stay still)
function demo(t){const order=[0,1,2,3,4,5,8,9,10,11,12,13,14,15,17],S=420,TB=order.length*S,TT=1300,SS=1100,C=TB+2*TT+2*SS+900,b=[],ax=[0,0,0,0];let u=t%C;
  if(u<TB){b[order[Math.floor(u/S)]]=1;return[b,ax]}u-=TB;
  if(u<TT){b[6]=Math.min(1,Math.sin(Math.PI*u/TT)*1.3);return[b,ax]}u-=TT;
  if(u<TT){b[7]=Math.min(1,Math.sin(Math.PI*u/TT)*1.3);return[b,ax]}u-=TT;
  for(const o of[0,2]){if(u<SS){const f=u/SS,a=Math.sin(Math.PI*f),g=f*6.2832-1.5708;ax[o]=Math.cos(g)*a;ax[o+1]=Math.sin(g)*a;return[b,ax]}u-=SS}
  return[b,ax]}
(function loop(t){
  if(!window.__freeze){
    let p=null,b,ax;const pads=navigator.getGamepads?navigator.getGamepads():[];
    for(const g of pads){if(!g||!g.connected)continue;if(g.mapping==='standard'){p=g;break}p=p||g}
    if(p){b=p.buttons.map(x=>x.value||(x.pressed?1:0));ax=p.axes}
    else if(PV){[b,ax]=(TCH.ptr.size||t-TCH.last<4000)?touchState(t):demo(t)}
    else{b=[];ax=[0,0,0,0]}
    draw(b,ax);post(b,ax);
  }
  requestAnimationFrame(loop);
})(0);
</script></body></html>
