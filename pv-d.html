  if(!caps.length)return;R.setProperty('--ky','1');let k=1;
  for(let i=0;i<4;i++){let w=0,h=0;for(const c of caps){const r=c.getBoundingClientRect();w+=r.width;h+=r.height}
    if(!(w>0&&h>0))break;k*=w/h;R.setProperty('--ky',k.toFixed(5));}}

(function(){const sv=$('svgroot'),W=sv.getBoundingClientRect().width||1;

for(const k in IDX)E[k]=$(k);

  const acc=getAcc();

    if(t.k!==key){t.k=key;
      t.g.setAttribute('transform',`translate(0 ${(t.v*PULL).toFixed(2)}) translate(0 ${YB}) scale(1 ${SY}) translate(0 ${-YB})`);
      t.c.style.fill=mixc(t.base,document.documentElement.dataset.theme==='shadow'?[255,176,46]:acc,t.v);
      }

    if(m<.04){x=y=0}else if(m>1){x/=m;y/=m}
    x=q(x,120);y=q(y,120);                           // 1/60 langkah, tak terlihat bedanya
