<script>
const Q=new URLSearchParams("demo=1"),R=document.documentElement.style;
function mix(h,t,a){const n=parseInt(h,16),c=[n>>16&255,n>>8&255,n&255].map(v=>Math.round(v+(t-v)*a));return'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')}
(function(){let a=(Q.get('accent')||'4df3ff').replace('#','');if(!/^[0-9a-fA-F]{6}$/.test(a))a='4df3ff';
 R.setProperty('--acc','#'+a);R.setProperty('--accHi',mix(a,255,.45));R.setProperty('--accLo',mix(a,0,.35));
 if(/^[0-9a-fA-F]{6}$/.test(Q.get('bg')||''))document.body.style.background='#'+Q.get('bg');})();
const IDX={a:0,b:1,x:2,y:3,lb:4,rb:5,view:8,menu:9,du:12,dd:13,dl:14,dr:15,share:17};   // Home sengaja tidak dipetakan (display saja)
const $=id=>document.getElementById(id),E={};for(const k in IDX)E[k]=$(k);
const YB=62,YT=-150,RG=YB-YT,JIT=[-1.5,0,1.5,0];
const TG={lt:{i:6,p:'tl'},rt:{i:7,p:'tr'}};
for(const k in TG){const t=TG[k],p=t.p;t.m=$(p+'m');t.f=$(p+'f');t.e=$(p+'e');t.o=$(p+'o');t.l=$(p+'l');t.cur=0;t.lo=.5;}
const ST={ls:{cx:354.0,cy:418.0,ai:0,bi:10},rs:{cx:976.5,cy:646.5,ai:2,bi:11}};
for(const k in ST){const s=ST[k];s.g=$(k+'c');s.sh=$(k+'s');s.hl=$(k+'h');s.hi=$(k+'i');s.d=$(k+'d');s.k=$(k+'k');s.r=$(k+'r');s.grad=document.getElementById('g'+k);s.ang=0;}
const TRAVEL=44,DZ=.09,FULL_AT=.96,T_FLOOR=.02;
// Display Home: counter kaset
const OSD=$('hosd'),TC=$('htc'),REC=$('hrec'),TXT={PAUSE:'II PAUSE',PLAY:'►PLAY',FF:'►►FF',REW:'◄◄REW'};
let tape=0,mode='',tcs='',last=performance.now();
function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/3600)+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function draw(b,ax,now){
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;let any=false;
  for(const k in IDX){const on=(b[IDX[k]]||0)>.5;if(on)any=true;E[k].classList.toggle('on',on)}
  $('dc').classList.toggle('on',!!(b[12]||b[13]||b[14]||b[15]));
  for(const k in TG){const t=TG[k],raw=Math.min(1,Math.max(0,b[t.i]||0)),tg=raw<T_FLOOR?0:raw>=FULL_AT?1:raw;
    t.cur+=(tg-t.cur)*.4;if(Math.abs(tg-t.cur)<.003)t.cur=tg;
    const v=t.cur,full=v>=.995,top=YB-RG*v,fy=full?YT-10:top,jx=v>.5?JIT[Math.floor(now/45)%4]:0,sh=`translate(${jx} ${(v*16).toFixed(2)})`;
    t.f.setAttribute('y',fy);t.f.setAttribute('height',v>.01?YB+120-fy:0);
    t.e.setAttribute('y',top-2);t.e.style.opacity=(v>.01&&!full)?1:0;
    t.m.setAttribute('transform',sh);t.o.setAttribute('transform',sh);
    t.o.style.opacity=full?.7:v*.5;
    const lo=v>.02?1:.5;if(lo!==t.lo){t.lo=lo;t.l.style.fillOpacity=lo}}
  for(const k in ST){const s=ST[k];let x=ax[s.ai]||0,y=ax[s.ai+1]||0;const m=Math.hypot(x,y);
    if(m<DZ){x=y=0}else if(m>1){x/=m;y/=m}
    const mg=Math.hypot(x,y),dx=x*TRAVEL,dy=y*TRAVEL,p=(b[s.bi]||0)>.5?1:0,sc=(1+mg*.035)*(p?.93:1);
    if(p)any=true;if(mg>0)any=true;
    s.g.setAttribute('transform',`translate(${s.cx+dx} ${s.cy+dy+p*3}) scale(${sc})`);
    s.sh.setAttribute('transform',`translate(${5-x*7} ${10-y*7})`);
    s.hl.setAttribute('transform',`translate(${-x*7} ${-y*7})`);s.hi.setAttribute('transform',`translate(${x*4} ${y*4})`);
    s.grad.setAttribute('fx',.36-x*.16);s.grad.setAttribute('fy',.3-y*.16);
    if(mg>0){s.ang+=(x>=0?1:-1)*mg*420*dt;s.r.setAttribute('transform','rotate('+s.ang.toFixed(1)+')')}
    s.d.style.opacity=mg*.65;s.k.style.opacity=p;}
  const lt=TG.lt.cur,rt=TG.rt.cur,m=(lt>.1||rt>.1)?(rt>=lt?'FF':'REW'):any?'PLAY':'PAUSE';
  if(m==='FF')tape+=dt*(1+rt*10);else if(m==='REW')tape=Math.max(0,tape-dt*(1+lt*10));else if(m==='PLAY')tape+=dt;
  if(m!==mode){mode=m;OSD.textContent=TXT[m];OSD.style.fill=(m==='FF'||m==='REW')?'#ffd23f':m==='PLAY'?'#6dff9a':'#fff';REC.style.display=m==='PAUSE'?'none':''}
  const c=fmt(tape);if(c!==tcs){tcs=c;TC.textContent=c}
}
// Demo: tombol -> trigger -> stik (cepat, lalu diam) -> loop. Home tidak pernah ditekan.
const ORD=[0,1,2,3,4,5,8,9,17,12,13,14,15,10,11],P1=ORD.length*450,P2=3200,P3=2400,P4=1200,TOT=P1+P2+P3+P4;
function demo(t){const u=t%TOT,b=[],a=[0,0,0,0];
  if(u<P1)b[ORD[Math.floor(u/450)]]=1;
  else if(u<P1+P2){const w=u-P1,h=P2/2,f=(w%h)/h;b[w<h?6:7]=Math.min(1,Math.sin(Math.PI*f)*1.3)}
  else if(u<P1+P2+P3){const w=(u-P1-P2)/1000,env=Math.max(0,Math.min(1,w/.2,(2.4-w)/.3)),th=w*6;
    a[0]=Math.cos(th)*env;a[1]=Math.sin(th)*env;a[2]=Math.cos(th)*env;a[3]=-Math.sin(th)*env}
  return[b,a]}
// Sentuhan HP: tekan tombol, geser stik, seret trigger (menimpa demo, demo lanjut 4 dtk setelah lepas)
const SV=$('s'),TB={},TVL={},TA=[0,0,0,0],PT=new Map();let lastT=-1e9;
function svgPt(e){const p=SV.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(SV.getScreenCTM().inverse())}
function hit(e){const el=document.elementFromPoint(e.clientX,e.clientY);if(!el)return null;
  const st=el.closest('.stk');if(st)return{t:'stk',k:st.id};
  const tr=el.closest('.trw');if(tr)return{t:'trg',k:tr.id==='tlg'?6:7};
  const bt=el.closest('.p,.bmp');if(bt&&IDX[bt.id]!==undefined)return{t:'btn',k:IDX[bt.id]};return null}
function apply(e){const s=PT.get(e.pointerId);if(!s)return;const p=svgPt(e);lastT=performance.now();
  if(s.t==='btn'){delete TB[s.cur];const h=hit(e);s.cur=(h&&h.t==='btn')?h.k:undefined;if(s.cur!==undefined)TB[s.cur]=1}
  else if(s.t==='trg')TVL[s.k]=Math.min(1,Math.max(0,(YB-p.y)/RG));
  else{const c=ST[s.k];let x=(p.x-c.cx)/80,y=(p.y-c.cy)/80;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}
    TA[c.ai]=x;TA[c.ai+1]=y;s.mv=Math.max(s.mv,Math.hypot(p.x-s.x0,p.y-s.y0))}}
SV.addEventListener('pointerdown',e=>{const h=hit(e);if(!h)return;e.preventDefault();SV.setPointerCapture(e.pointerId);
  const p=svgPt(e);PT.set(e.pointerId,{t:h.t,k:h.k,cur:h.t==='btn'?h.k:undefined,x0:p.x,y0:p.y,t0:performance.now(),mv:0});apply(e)});
SV.addEventListener('pointermove',e=>{if(PT.has(e.pointerId)){e.preventDefault();apply(e)}});
function up(e){const s=PT.get(e.pointerId);if(!s)return;PT.delete(e.pointerId);lastT=performance.now();
  if(s.t==='btn')delete TB[s.cur];else if(s.t==='trg')delete TVL[s.k];
  else{const c=ST[s.k];TA[c.ai]=TA[c.ai+1]=0;
    if(s.mv<12&&performance.now()-s.t0<300){TB[c.bi]=1;setTimeout(()=>{delete TB[c.bi]},180)}}}
SV.addEventListener('pointerup',up);SV.addEventListener('pointercancel',up);
(function loop(t){
  let p=null;const pads=navigator.getGamepads?navigator.getGamepads():[];
  for(const g of pads){if(!g||!g.connected)continue;if(g.mapping==='standard'){p=g;break}p=p||g}
  if(p)draw(p.buttons.map(x=>x.value||(x.pressed?1:0)),p.axes,t);
  else{let b=[],a=[0,0,0,0];
    if(Q.has('demo')&&!PT.size&&t-lastT>4000)[b,a]=demo(t);
    for(const k in TB)b[k]=1;for(const k in TVL)b[k]=TVL[k];if(TA[0]||TA[1]||TA[2]||TA[3])a=TA.slice();
    draw(b,a,t);}
  requestAnimationFrame(loop);
})(0);
</script></body></html>
