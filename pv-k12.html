// ---- mini game di Home: tombol = duri besar; kena duri = -1 hati; hati habis = GAME OVER lalu reset ----
const HM=$('home'),HJ=$('hj'),OB=[0,1,2,3,4].map(i=>({g:$('ob'+i),x:0,on:0})),GB=[0,1,2,3,4,5,8,9,10,11,12,13,14,15,17],PR={};

function game(now,b){const dt=Math.min(.05,Math.max(0,(now-G.l)/1000));G.l=now;

 HJ.setAttribute('transform',`translate(0 ${-Math.round(G.hy/2)*2})`);

const P=new Map(),V={last:-1e9,pl:{}};

// ---- demo: tombol -> trigger -> LT+RT (hati) -> stik kiri -> stik kanan -> diam ----
const SEQ=[0,1,2,3,4,5,12,13,14,15,8,9,17,10,11],SS=420,D=[SEQ.length*SS,1000,1000,1800,1000,1400,1400,900],LOOP=D.reduce((a,c)=>a+c,0);
function demo(t){let tt=t%LOOP,ph=0;while(tt>=D[ph]){tt-=D[ph];ph++}const b=[],ax=[0,0,0,0];
 if(ph===0){if(tt%SS<340)b[SEQ[Math.floor(tt/SS)]]=1}
 else if(ph===1)b[6]=Math.min(1,1.3*Math.sin(Math.PI*tt/D[1]));
