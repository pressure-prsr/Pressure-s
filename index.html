<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" href="logo.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png">
<title>Pressure's</title>
<style>
:root{--bg:#FAF9F5;--surface:#fff;--ink:#141413;--muted:#6b6a64;--accent:#c15f3c;--accent-ink:#fff;--line:#e8e6dc;--soft:#f0eee6;--ok:#4a8a5b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1e1d;--surface:#2a2927;--ink:#f0eee6;--muted:#a7a59b;--accent:#d97757;--accent-ink:#1f1e1d;--line:#3a3835;--soft:#262523;--ok:#7bc08e}}
:root[data-theme="dark"]{--bg:#1f1e1d;--surface:#2a2927;--ink:#f0eee6;--muted:#a7a59b;--accent:#d97757;--accent-ink:#1f1e1d;--line:#3a3835;--soft:#262523;--ok:#7bc08e}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.brand{font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:0}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{font-size:24px;text-decoration:none;color:inherit}
nav a{margin-left:16px;text-decoration:none;color:var(--muted);font-size:15px}
nav a:hover{color:var(--ink)}
.btn{display:inline-block;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;padding:11px 20px;cursor:pointer;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hero{padding:56px 0 24px}
.hero h1{font-size:clamp(32px,6vw,52px);max-width:16ch}
.hero p{color:var(--muted);max-width:50ch;margin:14px 0 0;font-size:17px}
section{padding:36px 0}
.alt{background:var(--soft)}
h2{font-size:clamp(24px,4vw,32px);margin-bottom:6px}
.lead{color:var(--muted);margin:0 0 20px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{font:inherit;font-weight:600;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:6px}
.card.star{border:2px solid var(--accent)}
.card h3{font-size:20px}
.card p{margin:0;color:var(--muted);font-size:15px}
.badge{align-self:flex-start;font-size:13px;font-weight:600;color:var(--accent)}
.price{font-weight:600;font-size:26px;margin-top:4px}
.price.ask{font-size:17px;font-family:inherit;font-weight:600;color:var(--muted)}
.card .btn{margin-top:10px}
.card>.price{margin-top:auto;padding-top:6px}
.row{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:20px;flex:none}
.meta{font-size:14px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}
.dot.on{background:var(--ok)}
.steps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;padding:14px 0;border-top:2px solid var(--line);font-size:15px;color:var(--muted)}
.steps li::before{content:"Langkah " counter(s);display:block;color:var(--accent);font-weight:600;font-size:14px}
.steps b{display:block;color:var(--ink);font-size:16px}
form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:560px;display:grid;gap:14px}
label{display:grid;gap:6px;font-size:14px;font-weight:600}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
textarea{min-height:76px;resize:vertical}
.note{font-size:13px;color:var(--muted);margin:0}
.inline{display:flex;gap:10px;max-width:520px}
.inline input{flex:1}
ul.plain{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:15px}
footer{border-top:1px solid var(--line);padding:24px 0 34px;color:var(--muted);font-size:14px}
@media (max-width:640px){nav a:not(.keep){display:none}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

.hd{display:grid!important;grid-template-columns:44px 1fr 44px;align-items:center}
.brand{text-align:center}
.ib{background:none;border:0;color:inherit;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;text-decoration:none}
.menu{display:none;border-top:1px solid var(--line);background:var(--bg)}
.menu.open{display:block}
.menu a{display:block;padding:13px 0;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.hero{text-align:center}
.hero h1{max-width:none;margin:0 auto}
.hero p{margin:14px auto 0}
@keyframes rim{0%,100%{border-color:#3fb950;box-shadow:0 0 0 0 rgba(63,185,80,0)}50%{border-color:rgba(63,185,80,.35);box-shadow:0 0 0 3px rgba(63,185,80,.14)}}
@keyframes blip{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.card.eks{border:1.5px solid #3fb950;animation:rim 2.4s ease-in-out infinite}
.badge.g{color:#2e8b3d;display:flex;align-items:center;gap:6px}
.dotg{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3fb950;animation:blip 1.2s ease-in-out infinite}
img.av{width:56px;height:56px;object-fit:cover;background:#000}
img.av.g{border:2px solid #3fb950}
@media (prefers-reduced-motion:reduce){.card.eks,.dotg{animation:none}}
.soc{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
footer .soc{margin:0 0 16px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);text-decoration:none;font-weight:600;font-size:15px}
.pill:hover{border-color:var(--accent)}
.wafab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:6}
.sub{margin:36px 0 6px;font-size:24px}
form[hidden]{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.tr{display:flex;justify-content:flex-end;gap:8px;padding-top:10px}
.ic{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;text-decoration:none}
.ic:hover{border-color:var(--accent)}
.tab.sm{padding:7px 16px;font-size:14px;border-radius:10px}
#stabs:empty{display:none}
#stabs{margin-top:-8px}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.gal[hidden]{display:none}
.gal img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;cursor:zoom-in;background:var(--soft)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:grid;place-items:center;z-index:20;padding:16px;cursor:zoom-out}
#lb[hidden]{display:none}
#lb img{max-width:100%;max-height:100%;border-radius:10px}
#jokilist{margin-top:16px}

/* drawer */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:30}
.ov.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(82vw,320px);background:var(--bg);border-right:1px solid var(--line);transform:translate3d(-100%,0,0);visibility:hidden;transition:transform .32s cubic-bezier(.32,.72,0,1),visibility 0s .32s;z-index:31;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);will-change:transform}
.drawer.on{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.32,.72,0,1),visibility 0s}
.dh{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 20px;border-bottom:1px solid var(--line);height:56px}
.dl{display:flex;flex-direction:column;padding:8px 0}
.dl a{padding:14px 20px;font-size:17px;color:var(--ink);text-decoration:none;transition:background-color .15s ease,transform .15s ease}
.dl a:active{background:var(--soft)}
.dsoc{margin-top:auto;padding:16px 20px;display:flex;gap:8px}
/* animasi ringan: hanya gerak dan transparansi */
.btn,.tab,.ic,.ib{-webkit-tap-highlight-color:transparent;transition:transform .2s cubic-bezier(.34,1.56,.64,1),background-color .15s ease,border-color .15s ease,opacity .15s ease}
.btn:active,.tab:active,.ic:active,.ib:active{transform:scale(.95);transition-duration:.08s}
.card{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
@media (hover:hover){.btn:hover{transform:translateY(-1px)}.card:hover{transform:translateY(-2px)}}
/* bingkai hijau SwiftPressure: hanya opacity yang beranimasi */
.card.eks{animation:none;position:relative}
.card.eks::after{content:"";position:absolute;inset:-2px;border-radius:15px;box-shadow:0 0 0 4px rgba(63,185,80,.28);opacity:0;pointer-events:none;animation:rimp 2.4s ease-in-out infinite}
@keyframes rimp{0%,100%{opacity:0}50%{opacity:1}}
/* dropdown */
.fld{display:grid;gap:6px}
.fl{font-size:14px;font-weight:600}
.dd{position:relative}
.dd-b{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;transition:border-color .15s ease,transform .15s ease}
.dd-b:active{transform:scale(.99)}
.dd.open .dd-b{border-color:var(--accent)}
.dd-t{display:flex;justify-content:space-between;gap:10px;flex:1;min-width:0}
.dd-t span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph{color:var(--muted)}
.pr{color:var(--muted);white-space:nowrap;font-size:14px}
.chev{flex:none;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.dd.open .chev{transform:rotate(180deg)}
.dd-l{list-style:none;margin:0;padding:6px;position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;max-height:260px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:12;opacity:0;visibility:hidden;pointer-events:none;transform:translate3d(0,-6px,0) scale(.98);transform-origin:top;transition:opacity .16s ease,transform .2s cubic-bezier(.2,.8,.2,1),visibility 0s .2s}
.dd.open .dd-l{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition:opacity .16s ease,transform .2s cubic-bezier(.2,.8,.2,1),visibility 0s}
.dd-l li{display:flex;justify-content:space-between;gap:10px;padding:11px 10px;border-radius:8px;cursor:pointer;font-size:15px}
.dd-l li:active,.dd-l li:hover{background:var(--soft)}
.dd-l li[aria-selected="true"]{background:var(--soft);font-weight:600}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.dd.err .dd-b{border-color:#c0392b;animation:shake .35s}
.emsg{color:#c0392b;font-size:13px;margin:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.tab{transition:background-color .2s ease,color .2s ease,border-color .2s ease}
.tab:active{transform:none}

/* perbaikan: teks panjang tidak lagi melebarkan form maupun pilihan dropdown */
form{grid-template-columns:minmax(0,1fr);min-width:0}
label,.fld{grid-template-columns:minmax(0,1fr);min-width:0;max-width:100%}
.fld,.dd{width:100%;min-width:0;max-width:100%}
.dd-b{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;width:100%;min-width:0;max-width:100%;overflow:hidden;contain:inline-size}
.dd-t{display:flex;justify-content:space-between;gap:10px;min-width:0;overflow:hidden}
.dd-t span:first-child{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-t .pr,.dd-l .pr{flex:none}
.dd-l{max-width:100%}
.dd-l li{align-items:flex-start;min-width:0}
.dd-l li span:first-child{flex:1 1 0;min-width:0;overflow-wrap:anywhere;word-break:break-word}
input,select,textarea{min-width:0;max-width:100%}
/* penanda tab yang meluncur */
.tabs{position:relative}
.tabs .ind{position:absolute;left:0;top:0;width:0;height:0;border-radius:999px;background:var(--accent);z-index:0;pointer-events:none;transition:transform .42s cubic-bezier(.34,1.25,.5,1),width .42s cubic-bezier(.34,1.25,.5,1)}
.tabs .ind.sm{border-radius:10px}
.tabs .tab{position:relative;z-index:1;transition:color .25s ease,border-color .25s ease}
.tabs .tab[aria-selected="true"]{background:transparent;border-color:transparent;color:var(--accent-ink)}
/* isi berganti dengan arah, kartu muncul berurutan */
.sw-out>*{opacity:0;transform:translate3d(var(--dx,0),0,0);transition:opacity .11s ease,transform .11s ease}
.sw-in0>*{opacity:0;transform:translate3d(var(--dx,0),0,0);transition:none}
.sw-in>*{opacity:1;transform:none;transition:opacity .28s cubic-bezier(.2,.8,.2,1),transform .36s cubic-bezier(.2,.8,.2,1)}
.sw-in>*:nth-child(2){transition-delay:28ms}
.sw-in>*:nth-child(3){transition-delay:56ms}
.sw-in>*:nth-child(n+4){transition-delay:84ms}

.hd{grid-template-columns:84px 1fr 84px!important}
.lg{justify-self:end;display:flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:2px;font:inherit;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
.lg span{padding:5px 9px;border-radius:999px;color:var(--muted);transition:background-color .2s ease,color .2s ease}
.lg[data-cur="id"] span[data-l="id"],.lg[data-cur="en"] span[data-l="en"]{background:var(--accent);color:var(--accent-ink)}
.dsoc .lg{margin-left:auto}
.pv{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#111;margin-bottom:6px;cursor:zoom-in}
.price small{font-size:14px;color:var(--muted);font-weight:400}
main.oth #cara,main.oth #testi,main.oth #pesan{background:var(--soft)}
main.oth #info,main.oth #status{background:transparent}

/* tab bisa digulir */
.tabwrap{position:relative;margin-bottom:20px}
#tabs{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;margin-bottom:0;scroll-snap-type:x proximity;overscroll-behavior-x:contain}
#tabs::-webkit-scrollbar{display:none}
#tabs .tab{flex:none;white-space:nowrap;scroll-snap-align:center}
.tabwrap::before,.tabwrap::after{content:"";position:absolute;top:0;bottom:11px;width:34px;pointer-events:none;opacity:0;transition:opacity .25s ease;z-index:2}
.tabwrap::after{right:0;background:linear-gradient(to right,transparent,var(--bg))}
.tabwrap::before{left:0;background:linear-gradient(to left,transparent,var(--bg))}
.tabwrap[data-r="1"]::after,.tabwrap[data-l="1"]::before{opacity:1}
.tline{height:3px;margin-top:8px;border-radius:99px;background:var(--line);opacity:0;transition:opacity .25s ease;overflow:hidden}
.tline.on{opacity:1}
.tline i{display:block;height:100%;width:0;border-radius:99px;background:var(--accent);opacity:.65;will-change:transform}
/* pilihan Other di dropdown */
.dd-l li.sep{position:relative;margin-top:8px}
.dd-l li.sep::before{content:"";position:absolute;left:10px;right:10px;top:-5px;height:1px;background:var(--line)}
/* kartu nama muncul */
.rv .av{opacity:0;transform:scale(.55)}
.rv .jn{display:block;overflow:hidden;padding-bottom:.14em;margin:0}
.rv .jn span{display:inline-block;transform:translate3d(0,115%,0)}
.rv .badge,.rv .meta,.rv .rt,.rv .btn{opacity:0;transform:translate3d(0,8px,0)}
.rv.in .av{opacity:1;transform:none;transition:opacity .35s ease,transform .6s cubic-bezier(.34,1.56,.64,1);transition-delay:calc(var(--d,0ms) + 40ms)}
.rv.in .jn span{transform:none;transition:transform .6s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--d,0ms) + 170ms)}
.rv.in .badge,.rv.in .meta,.rv.in .rt,.rv.in .btn{opacity:1;transform:none;transition:opacity .4s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
.rv.in .badge{transition-delay:calc(var(--d,0ms) + 20ms)}
.rv.in .meta{transition-delay:calc(var(--d,0ms) + 260ms)}
.rv.in .rt{transition-delay:calc(var(--d,0ms) + 330ms)}
.rv.in .btn{transition-delay:calc(var(--d,0ms) + 410ms)}
.card.eks.rv::after{animation:none;opacity:0}
/* pilihan tampilan grid (kategori Stream Overlay) */
.gv{display:none;align-items:center;gap:10px;margin:0 0 14px}
.gv .gl{font-size:13px;font-weight:600;color:var(--muted)}
.gv .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:2px}
.gv button{font:inherit;border:0;background:transparent;color:var(--muted);border-radius:999px;min-width:44px;height:36px;padding:0 12px;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color .2s ease,color .2s ease}
.gv button[hidden]{display:none}
.gv button.on{background:var(--accent);color:var(--accent-ink)}
.grid.gx.g1{grid-template-columns:minmax(0,1fr)}
.grid.gx.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.gx.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gx.g2,.gx.g3{gap:10px}
.gx.g2 .card,.gx.g3 .card{padding:12px;min-width:0}
.gx.g2 .card h3,.gx.g3 .card h3{font-size:16px;overflow-wrap:anywhere}
.gx.g3 .card h3{font-size:15px}
.gx.g2 .card p,.gx.g3 .card p{font-size:13px}
.gx.g2 .price,.gx.g3 .price{font-size:20px}
.gx.g2 .price.ask,.gx.g3 .price.ask{font-size:14px}
.gx.g2 .card .btn,.gx.g3 .card .btn{padding:9px 8px;font-size:14px}
@media (max-width:340px){.hd{grid-template-columns:80px minmax(0,1fr) 80px!important}.brand{font-size:21px}}
.cv{position:relative;border-radius:12px;overflow:hidden;background:#0a1815;margin-bottom:6px}
.cvt{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x pan-y}
.cvt::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;position:relative;aspect-ratio:16/9;container-type:inline-size;overflow:hidden}
.sl>img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}.sl.an>img{cursor:default}
.sl i{position:absolute;width:.5cqw;height:.5cqw;min-width:3px;min-height:3px;border-radius:50%;background:#f2b94b;box-shadow:0 0 1.2cqw .6cqw #f2b94b88;animation:ffd 9s ease-in-out infinite}
.sl b,.sl span{position:absolute;left:0;right:0;text-align:center;color:#f5ecd7;font-family:Georgia,serif;pointer-events:none}
.sl b{top:42%;font-size:4.8cqw;animation:ffg 5s infinite}.sl span{top:55%;font-size:1.8cqw;color:#f2b94b;font-weight:400}
.sl:not(.act) i,.sl:not(.act) b{animation-play-state:paused}
@keyframes ffd{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(2cqw,-4cqw);opacity:1}}
@keyframes ffg{50%{text-shadow:0 0 2cqw #f2b94b}}
.tg{position:absolute;left:8px;top:8px;font-style:normal;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:rgba(10,24,21,.72);color:#f5ecd7;pointer-events:none}.tg.a{color:#f2b94b}
.cvc{position:absolute;right:8px;top:8px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:rgba(10,24,21,.72);color:#f5ecd7;pointer-events:none}

GAMES.filter(function(g){return g.other})[0].paket.push({n:"Overlay Controller Xbox Series X - Pixel Arcade Edition",ne:"Xbox Series X Controller Overlay - Pixel Arcade Edition",d:"Edisi khusus overlay controller Xbox Series X bertema Pixel Arcade yang bergerak mengikuti gamepad. Sekali beli dapat 3 pilihan desain: Dino Atas, Dino Tengah, dan Tanpa Dino.",de:"A special-edition Pixel Arcade Xbox Series X controller overlay that follows your gamepad. One purchase includes 3 design options: Dino Top, Dino Center, and No Dino.",h:259000,usd:23,overlay:true,show:true,ctl:true,cvs:true,os:"controller"});
GAMES.filter(function(g){return g.other})[0].paket.push({n:"Overlay Controller Xbox Series X - Water Ring Edition",ne:"Xbox Series X Controller Overlay - Water Ring Edition",d:"Edisi overlay controller Xbox Series X bertema Water Ring yang bergerak mengikuti gamepad. Trigger LT dan RT jadi pompa air: tekan untuk menyemprot dan mengangkat ring ke tiang, seperti mainan ring air klasik. Tombol, stik, dan bumper ikut menyala saat ditekan, dengan tampilan kaca bernuansa ungu dan pink.",de:"A Water Ring Edition Xbox Series X controller overlay that follows your gamepad. LT and RT become water pumps: press them to spray water and lift the rings onto the pegs, like the classic water ring toy. Buttons, sticks, and bumpers light up as you press them, in a glassy purple and pink look.",h:225000,usd:20,overlay:true,show:true,ctl:true,cvk:"w",os:"controller"});
GAMES.filter(function(g){return g.other})[0].paket.push({n:"Overlay Controller Xbox Series X - Silk Classic",ne:"Xbox Series X Controller Overlay - Silk Classic",d:"Edisi overlay controller Xbox Series X bertema Silk yang bergerak mengikuti gamepad. Tampilan putih mulus dengan aksen coral. Trigger LT dan RT berupa meter isi yang menampilkan persentase hingga MAX, stik ikut bergeser, dan setiap tombol yang ditekan muncul sebagai riwayat dengan hitungan kombo. Warna aksen bisa disesuaikan.",de:"A Silk Classic Xbox Series X controller overlay that follows your gamepad, with a smooth white body and coral accents. LT and RT are fill meters that show a percentage up to MAX, the sticks shift as you move them, and each button press appears in a history with a combo counter. The accent color is adjustable.",h:99000,usd:8,overlay:true,show:true,ctl:true,cvk:"s",os:"controller"});
GAMES.filter(function(g){return g.other})[0].paket.push({n:"Overlay Controller Xbox Series X - Fantasy RPG Gold Edition",ne:"Xbox Series X Controller Overlay - Fantasy RPG Gold Edition",d:"Edisi overlay controller Xbox Series X bertema Fantasy RPG Gold yang bergerak mengikuti gamepad. Badan bernuansa emas dengan tombol A, B, X, Y berbentuk permata. Trigger LT dan RT terisi sesuai tekanan, dan stik bergeser mengikuti gerakan. Empat input terakhir muncul di gulungan mantra, dan setelah 8 input beruntun aktif Mode Ultimate lengkap dengan hitung mundur. Warna aksen dan tulisan Ultimate bisa disesuaikan.",de:"A Fantasy RPG Gold Edition Xbox Series X controller overlay that follows your gamepad. A golden body with gem-shaped A, B, X, and Y buttons. LT and RT fill according to how far you press, and the sticks shift as you move them. Your last four inputs appear on a spell scroll, and after 8 inputs in a row Ultimate Mode kicks in with a countdown. The accent color and the Ultimate text are adjustable.",h:299000,usd:23,overlay:true,show:true,ctl:true,cvk:"g",os:"controller"});
GAMES.filter(function(g){return g.other})[0].paket.push({n:"Overlay Controller PS5 DualSense - Shadow Fight 2 Classic",ne:"PS5 DualSense Controller Overlay - Shadow Fight 2 Edition",d:"Edisi overlay controller PS5 DualSense bertema Shadow Fight 2 yang bergerak mengikuti gamepad. Body 3D dua nada coklat gelap dan coklat terang dengan sambungan yang halus. Trigger L2 dan R2 bergerak sesuai tekanan, stik bergeser mengikuti gerakan, dan tombol, bumper, serta touchpad menyala saat ditekan. Warna aksen bisa disesuaikan.",de:"A Shadow Fight 2 Edition PS5 DualSense controller overlay that follows your gamepad. A 3D two-tone body in dark and light brown with a smooth seam. L2 and R2 move with how far you press, the sticks shift as you move them, and the buttons, bumpers, and touchpad light up when pressed. The accent color is adjustable.",h:150000,usd:9,overlay:true,show:true,ctl:true,cvk:"d",os:"controller"});
GAMES.filter(function(g){return g.other})[0].paket.push({n:"Overlay Controller Xbox Series X - Dark Glass Classic",ne:"Xbox Series X Controller Overlay - Dark Glass Edition",d:"Edisi overlay controller Xbox Series X bertema Dark Glass yang bergerak mengikuti gamepad. Body kaca gelap dengan aksen biru es. Trigger LT dan RT berupa meter isi, stik bergeser mengikuti gerakan, dan tiga input terakhir muncul sebagai riwayat singkat. Warna aksen bisa disesuaikan.",de:"A Dark Glass Edition Xbox Series X controller overlay that follows your gamepad. A dark glass body with an icy blue accent. LT and RT are fill meters, the sticks shift as you move them, and your last three inputs appear as a short history. The accent color is adjustable.",h:99000,usd:9,overlay:true,show:true,ctl:true,cvk:"k1",os:"controller"});
GAMES.filter(function(g){return g.other})[0].paket.push({n:"Overlay Controller Xbox Series X - Esports Angular Classic",ne:"Xbox Series X Controller Overlay - Esports Angular Edition",d:"Edisi overlay controller Xbox Series X bertema Esports dengan bentuk bersudut tegas dan aksen cyan. Setiap tombol yang ditekan disapu kilatan cahaya, trigger LT dan RT terisi sesuai tekanan, dan stik menampilkan penunjuk arah delapan sektor. Warna aksen bisa disesuaikan.",de:"An Esports Angular Edition Xbox Series X controller overlay that follows your gamepad, with sharp angular shapes and a cyan accent. A light sweep crosses every button you press, LT and RT fill with how far you press, and each stick shows an eight-sector direction indicator. The accent color is adjustable.",h:99000,usd:9,overlay:true,show:true,ctl:true,cvk:"k2",os:"controller"});
GAMES.filter(function(g){return g.other})[0].paket.push({n:"Overlay Controller Xbox Series X - Comic Pop Art Classic",ne:"Xbox Series X Controller Overlay - Comic Pop Art Edition",d:"Edisi overlay controller Xbox Series X bertema Comic Pop Art dengan titik halftone dan aksen kuning mencolok. Tekan LT atau RT sampai penuh untuk memompa balon di dalam body, dan setelah lima pompaan balon meledak lalu warna body berganti di antara tujuh palet. Stik ikut bergeser, dan tombol menyala saat ditekan.",de:"A Comic Pop Art Edition Xbox Series X controller overlay that follows your gamepad, with halftone dots and a bold yellow accent. Press LT or RT all the way to pump a balloon inside the body, and after five pumps it bursts and the body switches between seven color palettes. The sticks shift as you move them, and buttons light up when pressed.",h:85000,usd:8,overlay:true,show:true,ctl:true,cvk:"k3",os:"controller"});
GAMES.filter(function(g){return g.other})[0].paket.push({n:"Overlay Controller Xbox Series X - Manga Ink Edition",ne:"Xbox Series X Controller Overlay - Manga Ink Edition",d:"Edisi overlay controller Xbox Series X bertema manga hitam-putih yang bergerak mengikuti gamepad. Setiap tombol yang ditekan memunculkan efek garis ledakan, dan tekan beruntun untuk memunculkan garis kecepatan. Tekan L3 dan R3 hampir bersamaan untuk berpindah ke mode bertekstur dengan efek lingkaran yang menyapu. Trigger LT dan RT terisi sesuai tekanan.",de:"A black-and-white manga Xbox Series X controller overlay that follows your gamepad. Each button press triggers a burst-line effect, and pressing in quick succession brings up speed lines. Press L3 and R3 almost together to switch to a textured mode with a sweeping circle effect. LT and RT fill with how far you press.",h:195000,usd:15,overlay:true,show:true,ctl:true,cvk:"k4",os:"controller"});
GAMES.filter(function(g){return g.other})[0].paket.push({n:"Overlay Controller Xbox Series X - Pirate Ship Edition",ne:"Xbox Series X Controller Overlay - Pirate Ship Edition",d:"Edisi overlay controller Xbox Series X bertema bajak laut yang bergerak mengikuti gamepad. Trigger LT dan RT mengisi air, tombol A, B, X, Y memunculkan riak dan koin, dan peti harta terisi seiring kamu menekan tombol. Di tengah body, kapal berlayar di peta antara pulau dan tanda X. Warna aksen bisa disesuaikan.",de:"A pirate-themed Xbox Series X controller overlay that follows your gamepad. LT and RT fill with water, the A, B, X, and Y buttons make ripples and coins, and a treasure chest fills up as you press. In the middle of the body, a ship sails across a map between an island and an X. The accent color is adjustable.",h:199000,usd:15,overlay:true,show:true,ctl:true,cvk:"k5",os:"controller"});
GAMES.filter(function(g){return g.other})[0].paket.push({n:"Overlay Controller Xbox Series X - Street Graffiti 3D Classic",ne:"Xbox Series X Controller Overlay - Street Graffiti 3D Edition",d:"Edisi overlay controller Xbox Series X bertema graffiti jalanan 3D yang bergerak mengikuti gamepad. Setiap tombol yang ditekan menuliskan hurufnya sebagai coretan di tembok dengan warna tombol itu, lengkap dengan cipratan cat, kabut, dan tetesan. Trigger LT dan RT terisi sesuai tekanan, dan stik bergeser mengikuti gerakan.",de:"A 3D street graffiti Xbox Series X controller overlay that follows your gamepad. Each button you press scrawls its letter on the wall in that button's color, with paint splashes, mist, and drips. LT and RT fill with how far you press, and the sticks shift as you move them.",h:99000,usd:12,overlay:true,show:true,ctl:true,cvk:"k6",os:"controller"});
GAMES.filter(function(g){return g.other})[0].paket.push({n:"Overlay Controller PS5 DualSense - Art Deco Classic",ne:"PS5 DualSense Controller Overlay - Art Deco Edition",d:"Edisi overlay controller PS5 DualSense bertema Art Deco yang bergerak mengikuti gamepad. Body 3D hitam dengan ornamen geometris emas. Trigger L2 dan R2 bergerak sesuai tekanan, stik bergeser mengikuti gerakan, dan tombol menyala saat ditekan. Warna aksen bisa disesuaikan.",de:"An Art Deco Edition PS5 DualSense controller overlay that follows your gamepad. A black 3D body with gold geometric ornaments. L2 and R2 move with how far you press, the sticks shift as you move them, and buttons light up when pressed. The accent color is adjustable.",h:105000,usd:9,overlay:true,show:true,ctl:true,cvk:"d2",os:"controller"});
GAMES.filter(function(g){return g.other})[0].paket.push({n:"Overlay Controller Xbox Series X - Watercolor Classic",ne:"Xbox Series X Controller Overlay - Watercolor Edition",d:"Edisi overlay controller Xbox Series X bertema Watercolor yang bergerak mengikuti gamepad. Body biru keunguan dengan noda cat air lembut. Setiap tombol yang ditekan memercikkan tinta, dan enam input terakhir muncul sebagai tetesan warna di palet atas. Trigger LT dan RT berupa meter isi dengan penanda puncak, dan stik bergeser mengikuti gerakan. Warna aksen bisa disesuaikan.",de:"A Watercolor Edition Xbox Series X controller overlay that follows your gamepad. A soft indigo body with gentle watercolor washes. Every button you press splashes ink, and your last six inputs appear as paint drops on the palette strip above. LT and RT are fill meters with a peak marker, and the sticks shift as you move them. The accent color is adjustable.",h:99000,usd:8,overlay:true,show:true,ctl:true,cvk:"k7",os:"controller"});

GAMES.filter(function(g){return g.other})[0].paket.push({n:"Overlay Controller Xbox Series X - Military Tactical Classic",ne:"Xbox Series X Controller Overlay - Military Tactical Edition",d:"Edisi overlay controller Xbox Series X bertema Military Tactical yang bergerak mengikuti gamepad. Body hijau army dengan garis kontur peta, huruf stensil pada tombol A, B, X, dan Y, dan display Home berupa radar yang terus menyapu. Trigger LT dan RT terisi oranye sesuai tekanan, dan stik bergeser mengikuti gerakan. Warna aksen bisa disesuaikan.",de:"A Military Tactical Edition Xbox Series X controller overlay that follows your gamepad. An army-green body with map contour lines, stencil lettering on the A, B, X, and Y buttons, and a Home display shaped like a constantly sweeping radar. LT and RT fill in orange as you press, and the sticks shift as you move them. The accent color is adjustable.",h:99000,usd:8,overlay:true,show:true,ctl:true,cvk:"k8",os:"controller"});

GAMES.filter(function(g){return g.other})[0].paket.push({n:"Overlay Controller Xbox Series X - Arcade Cabinet Edition",ne:"Xbox Series X Controller Overlay - Arcade Cabinet Edition",d:"Edisi overlay controller Xbox Series X bertema Arcade Cabinet yang bergerak mengikuti gamepad. Stik berbentuk joystick merah ala mesin arcade, dan panel atas menampilkan hitungan CREDIT yang bertambah setiap tombol ditekan, lengkap dengan koin yang jatuh ke slot. Display Home menampilkan INSERT COIN, trigger LT dan RT terisi hingga tulisan MAX, dan tombol menyala saat ditekan.",de:"An Arcade Cabinet Edition Xbox Series X controller overlay that follows your gamepad. The sticks look like red arcade joysticks, and the top panel shows a CREDIT counter that goes up with every button press, complete with a coin dropping into the slot. The Home display reads INSERT COIN, LT and RT fill up to a MAX label, and the buttons light up as you press them.",h:220000,usd:18,overlay:true,show:true,ctl:true,cvk:"k9",os:"controller"});

GAMES.filter(function(g){return g.other})[0].paket.push({n:"Overlay Controller Xbox Series X - VHS Analog Edition",ne:"Xbox Series X Controller Overlay - VHS Analog Edition",d:"Edisi overlay controller Xbox Series X bertema VHS Analog yang bergerak mengikuti gamepad. Body bergaris scanline dengan stiker kaset VHS T-120 dan stik berbentuk roda kaset. Display Home jadi counter VCR dengan mode PLAY, FF, REW, dan PAUSE lengkap dengan hitungan waktu. Trigger LT dan RT terisi bergaris cyan, dan sesekali garis tracking glitch lewat di body. Warna aksen bisa disesuaikan.",de:"A VHS Analog Edition Xbox Series X controller overlay that follows your gamepad. A scanlined body with a VHS T-120 tape sticker and sticks shaped like tape reels. The Home display becomes a VCR counter with PLAY, FF, REW, and PAUSE modes and a running timecode. LT and RT fill with cyan scanlines, and a tracking glitch line occasionally sweeps across the body. The accent color is adjustable.",h:245000,usd:20,overlay:true,show:true,ctl:true,cvk:"k10",os:"controller"});

GAMES.filter(function(g){return g.other})[0].paket.push({n:"Overlay Controller Xbox Series X - Samurai Ukiyo-e Edition",ne:"Xbox Series X Controller Overlay - Samurai Ukiyo-e Edition",d:"Edisi overlay controller Xbox Series X bertema Samurai Ukiyo-e yang bergerak mengikuti gamepad. Body biru indigo dengan gulungan di plat atas yang mencatat riwayat input, serta panji matahari merah dan ombak besar di bawah. Setelah tiga input beruntun, display Home menampilkan tebasan dan kanji kombo yang berubah menjadi 極 saat kombo makin panjang. Cincin merah menyala di stik yang ditekan, dan trigger terisi sesuai tekanan. Warna aksen bisa disesuaikan.",de:"A Samurai Ukiyo-e Edition Xbox Series X controller overlay that follows your gamepad. An indigo body with a scroll on the top plate that records your input history, and a banner with a red sun and a great wave below. After three inputs in a row, the Home display shows a slash and a combo kanji that turns into 極 as the combo grows. A red ring lights up on the stick you press, and the triggers fill with how far you press. The accent color is adjustable.",h:199000,usd:18,overlay:true,show:true,ctl:true,cvk:"k11",os:"controller"});

GAMES.filter(function(g){return g.other})[0].paket.push({n:"Overlay Controller Xbox Series X - Pixel 8-bit Classic",ne:"Xbox Series X Controller Overlay - Pixel 8-bit Edition",d:"Edisi overlay controller Xbox Series X bertema Pixel 8-bit yang bergerak mengikuti gamepad. Body ungu bertekstur dither dengan tombol segi delapan ala piksel dan stik bermata. Display Home adalah mini game: setiap tombol yang ditekan memunculkan duri, kena duri mengurangi satu dari tiga hati, dan saat hati habis muncul GAME OVER sebelum game mengulang. Trigger LT dan RT terisi bergaris. Warna aksen bisa disesuaikan.",de:"A Pixel 8-bit Edition Xbox Series X controller overlay that follows your gamepad. A purple dithered body with octagonal pixel buttons and sticks with little eyes. The Home display is a mini game: every button press spawns a spike, a hit costs one of three hearts, and when the hearts run out GAME OVER appears before the game restarts. LT and RT fill with stripes. The accent color is adjustable.",h:99000,usd:8,overlay:true,show:true,ctl:true,cvk:"k12",os:"controller"});

GAMES.filter(function(g){return g.other})[0].paket.push({n:"Overlay Controller Xbox Series X - Steampunk Brass Edition",ne:"Xbox Series X Controller Overlay - Steampunk Brass Edition",d:"Edisi overlay controller Xbox Series X bertema Steampunk Brass yang bergerak mengikuti gamepad. Body kuningan dan kayu dengan roda gigi berputar serta kereta mainan yang berjalan di rel mengelilingi body. Display Home berupa speedometer berjarum: makin banyak tombol ditekan jarum makin naik, RT penuh membawanya ke batas dengan asap yang terus keluar, dan jarum turun mengikuti tekanan RT. Trigger LT dan RT terisi sesuai tekanan. Warna aksen bisa disesuaikan.",de:"A Steampunk Brass Edition Xbox Series X controller overlay that follows your gamepad. A brass and wood body with spinning gears and a toy train that runs on rails around the body. The Home display is a needle speedometer: the more buttons you press, the higher the needle climbs, a full RT pushes it to the limit with steam that keeps coming, and the needle drops as you ease off RT. LT and RT fill with how far you press. The accent color is adjustable.",h:220000,usd:19,overlay:true,show:true,ctl:true,cvk:"k13",os:"controller"});

GAMES.filter(function(g){return g.other})[0].paket.push({n:"Overlay Controller Xbox Series X - Western Saloon Edition",ne:"Xbox Series X Controller Overlay - Western Saloon Edition",d:"Edisi overlay controller Xbox Series X bertema Western Saloon yang bergerak mengikuti gamepad. Body papan kayu dengan lencana sheriff di display Home dan poster buron di plat atas yang berganti-ganti: WANTED $5000, DEAD OR ALIVE, REWARD $9999, lengkap dengan cap BUSTED!. Setiap tombol yang ditekan meninggalkan lubang peluru, dan tombol menyala keemasan. Trigger LT dan RT terisi sesuai tekanan. Warna aksen bisa disesuaikan.",de:"A Western Saloon Edition Xbox Series X controller overlay that follows your gamepad. A wooden plank body with a sheriff badge on the Home display and a wanted poster on the top plate that cycles through WANTED $5000, DEAD OR ALIVE, and REWARD $9999, plus a BUSTED! stamp. Every button you press leaves a bullet hole, and the buttons glow gold. LT and RT fill with how far you press. The accent color is adjustable.",h:185000,usd:17,overlay:true,show:true,ctl:true,cvk:"k14",os:"controller"});

GAMES.filter(function(g){return g.other})[0].paket.push({n:"Overlay Controller Xbox Series X - Tropical Summer Beach Classic",ne:"Xbox Series X Controller Overlay - Tropical Summer Beach Edition",d:"Edisi overlay controller Xbox Series X bertema Tropical Summer Beach yang bergerak mengikuti gamepad. Body memakai tekstur foto pantai tropis dengan pasir, laut, dan daun palem, dan display Home berupa matahari. Setiap tombol yang ditekan menambah meter Ombak Combo: makin tinggi meter, makin tinggi ombak bergulung di body, dan ombak surut setelah 2,5 detik tanpa input. Trigger LT dan RT terisi sesuai tekanan. Warna aksen bisa disesuaikan.",de:"A Tropical Summer Beach Edition Xbox Series X controller overlay that follows your gamepad. The body uses a tropical beach photo texture with sand, sea, and palm leaves, and the Home display is a sun. Every button press raises the Wave Combo meter: the higher the meter, the higher the waves rolling across the body, and they recede after 2.5 seconds without input. LT and RT fill with how far you press. The accent color is adjustable.",h:99000,usd:8,overlay:true,show:true,ctl:true,cvk:"k15",os:"controller"});

GAMES.filter(function(g){return g.other})[0].paket.push({n:"Overlay Controller Xbox Series X - Mecha Edition",ne:"Xbox Series X Controller Overlay - Mecha Edition",d:"Edisi overlay controller Xbox Series X bertema Mecha yang bergerak mengikuti gamepad. Body baja abu-abu dengan baut, pelat UNIT-X, dan strip peringatan kuning-hitam di plat atas. Display Home berupa inti reaktor cyan dengan cincin yang terus berputar. Trigger LT dan RT terisi bergaris kuning sesuai tekanan, stik bergeser mengikuti gerakan, dan tombol menyala saat ditekan. Warna aksen bisa disesuaikan.",de:"A Mecha Edition Xbox Series X controller overlay that follows your gamepad. A steel-gray body with bolts, a UNIT-X plate, and a yellow-black warning strip on the top plate. The Home display is a cyan reactor core with a ring that keeps spinning. LT and RT fill with yellow stripes as you press, the sticks shift as you move them, and the buttons light up when pressed. The accent color is adjustable.",h:199000,usd:17,overlay:true,show:true,ctl:true,cvk:"k16",os:"controller"});
