s.d.style.opacity=mg*.65;s.k.style.opacity=p}}
// demo: semua tombol, trigger, analog (analog selesai lalu diam); Home tidak pernah ditekan
const ORD=[0,1,2,3,4,5,8,9,10,11,12,13,14,15,17],SEG=420,A1=ORD.length*SEG,A2=A1+2400,A3=A2+2200,CY=A3+900;
function demo(t){const c=t%CY,b=[],ax=[0,0,0,0];
if(c<A1)b[ORD[Math.floor(c/SEG)]]=1;
else if(c<A2){const u=c-A1;if(u<1200)b[6]=Math.sin(Math.PI*u/1200);else b[7]=Math.sin(Math.PI*(u-1200)/1200)}
else if(c<A3){const u=c-A2,e=Math.sin(Math.PI*u/2200),an=u/330;ax[0]=Math.cos(an)*e;ax[1]=Math.sin(an)*e;ax[2]=Math.sin(an*1.1)*e;ax[3]=Math.cos(an*1.1)*e}
return[b,ax]}
// sentuh (hanya mode preview ?demo)
const T={held:{},until:{},pid:new Map(),last:-1e9,tv:[0,0],tH:[0,0],ax:[0,0,0,0],k:{ls:0,rs:0}};
const SEL='#a,#b,#x,#y,#lb,#rb,#view,#menu,#du,#dd,#dl,#dr,#share,#ls,#rs,#tlg,#trg';
function spt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function mvS(e,o){const s=ST[o.id],p=spt(e);let x=(p.x-s.cx)/150,y=(p.y-s.cy)/150,m=Math.hypot(x,y);
if(m>1){x/=m;y/=m;m=1}if(m>=.2)o.mv=1;const i=o.id==='ls'?0:2;T.ax[i]=o.mv?x:0;T.ax[i+1]=o.mv?y:0;T.k[o.id]=o.mv?0:1}
if(PV){
svg.addEventListener('pointerdown',e=>{const el=e.target.closest(SEL);if(!el)return;e.preventDefault();const now=performance.now();T.last=now;
const o={id:el.id};T.pid.set(e.pointerId,o);try{svg.setPointerCapture(e.pointerId)}catch(_){}
if(o.id==='ls'||o.id==='rs')mvS(e,o);else if(o.id==='tlg')T.tH[0]++;else if(o.id==='trg')T.tH[1]++;else{T.held[o.id]=(T.held[o.id]||0)+1;T.until[o.id]=now+130}});
svg.addEventListener('pointermove',e=>{const o=T.pid.get(e.pointerId);if(!o)return;T.last=performance.now();if(o.id==='ls'||o.id==='rs')mvS(e,o)});
const up=e=>{const o=T.pid.get(e.pointerId);if(!o)return;T.pid.delete(e.pointerId);T.last=performance.now();
if(o.id==='ls'||o.id==='rs'){const i=o.id==='ls'?0:2;T.ax[i]=T.ax[i+1]=0;T.k[o.id]=0}else if(o.id==='tlg')T.tH[0]--;else if(o.id==='trg')T.tH[1]--;else T.held[o.id]--};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);svg.addEventListener('contextmenu',e=>e.preventDefault())}
function touch(now,dt){const b=[];for(const k in IDX)if(T.held[k]>0||now<(T.until[k]||0))b[IDX[k]]=1;
for(let i=0;i<2;i++)T.tv[i]=T.tH[i]>0?Math.min(1,T.tv[i]+dt/.75):0;
b[6]=T.tv[0];b[7]=T.tv[1];b[10]=T.k.ls;b[11]=T.k.rs;return[b,T.ax]}
let p0=0;
(function loop(t){const dt=Math.min(.1,(t-p0)/1000);p0=t;let p=null;
const pads=navigator.getGamepads?navigator.getGamepads():[];
for(const g of pads){if(!g||!g.connected)continue;if(g.mapping==='standard'){p=g;break}p=p||g}
if(p)draw(p.buttons.map(x=>x.value||(x.pressed?1:0)),p.axes);
else if(PV){const r=(t-T.last>4000&&!T.pid.size)?demo(t):touch(t,dt);draw(r[0],r[1])}
else draw([],[0,0,0,0]);
requestAnimationFrame(loop)})(0);
