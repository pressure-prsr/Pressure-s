<script>
const Q=new URLSearchParams("demo=1"),R=document.documentElement.style;
function mix(h,t,a){const n=parseInt(h,16),c=[n>>16&255,n>>8&255,n&255].map(v=>Math.round(v+(t-v)*a));return'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')}
(function(){let a=(Q.get('accent')||'ff6ad5').replace('#','');if(!/^[0-9a-fA-F]{6}$/.test(a))a='ff6ad5';
 R.setProperty('--acc','#'+a);R.setProperty('--accHi',mix(a,255,.45));R.setProperty('--accLo',mix(a,0,.35));
 if(/^[0-9a-fA-F]{6}$/.test(Q.get('bg')||''))document.body.style.background='#'+Q.get('bg');})();
const IDX={a:0,b:1,x:2,y:3,lb:4,rb:5,view:8,menu:9,du:12,dd:13,dl:14,dr:15,share:17};
const $=id=>document.getElementById(id),E={},PR={};for(const k in IDX)E[k]=$(k);
const FXK={};for(const k in IDX){const r=$('fr_'+k);if(r)FXK[k]=[r,$('fs_'+k)]}
function pop(k){const f=FXK[k];if(!f)return;for(const e of f){e.classList.remove('go');e.getBoundingClientRect();e.classList.add('go')}}
const MOOD={a:'#5ef2b0',b:'#ff6ad5',x:'#6cc8ff',y:'#ffc24d',lb:'#b78cff',rb:'#b78cff',view:'#ffb347',menu:'#ffb347',share:'#ffb347',du:'#ffd9a0',dd:'#ffd9a0',dl:'#ffd9a0',dr:'#ffd9a0'};
const halo=$('halo'),hs1=$('hs1'),mrim=$('mrim');let mc='';
function mood(c){const on=!!c;c=c||'#ffb347';if(c!==mc){mc=c;mrim.setAttribute('stroke',on?c:'#d65bd0')}
 halo.style.opacity=on?1:.85;mrim.style.opacity=on?.85:.35}
const YT=-150,TG={lt:{i:6,p:'tl'},rt:{i:7,p:'tr'}};
for(const k in TG){const t=TG[k],p=t.p;t.m=$(p+'m');t.f=$(p+'f');t.e=$(p+'e');t.o=$(p+'o');t.cur=0;t.last=-1}
const ST={ls:{cx:354.0,cy:418.0,ai:0,bi:10,w:'lsw'},rs:{cx:976.5,cy:646.5,ai:2,bi:11,w:'rsw'}};
for(const k in ST){const s=ST[k];s.g=$(k+'c');s.sh=$(k+'s');s.hl=$(k+'h');s.hi=$(k+'i');s.d=$(k+'d');s.k=$(k+'k');s.grad=$('g'+k);s.W=$(s.w);s.sp=0;s.ang=0;s.lx=NaN;s.ly=NaN;s.lp=-1}
const TRAVEL=34,DZ=.09,FULL_AT=.96,T_FLOOR=.02;
function draw(b,ax){
  let mk='';
  for(const k in IDX){const on=(b[IDX[k]]||0)>.5;if(on!==PR[k]){PR[k]=on;E[k].classList.toggle('on',on);if(on)pop(k)}if(on&&MOOD[k])mk=MOOD[k]}
  $('dc').classList.toggle('on',!!(b[12]||b[13]||b[14]||b[15]));
  for(const k in TG){const t=TG[k],raw=Math.min(1,Math.max(0,b[t.i]||0)),tg=raw<T_FLOOR?0:raw>=FULL_AT?1:raw;
    t.cur+=(tg-t.cur)*.4;if(Math.abs(tg-t.cur)<.003)t.cur=tg;const v=t.cur;if(v>.4)mk=mk||'#ff6ad5';
    if(v!==t.last){t.last=v;const full=v>=.995,bot=full?170:YT+(150-YT)*v,sh=`translate(0 ${(v*16).toFixed(2)})`;
      t.f.setAttribute('height',v>.004?bot-(YT-10):0);t.e.setAttribute('y',bot-3);t.e.style.opacity=(v>.01&&!full)?1:0;
      t.m.setAttribute('transform',sh);t.o.setAttribute('transform',sh);t.o.style.opacity=full?.5:v*.4}}
  mood(mk);
  for(const k in ST){const s=ST[k];let x=ax[s.ai]||0,y=ax[s.ai+1]||0;const m=Math.hypot(x,y);
    if(m<DZ){x=y=0}else if(m>1){x/=m;y/=m}
    const mg=Math.hypot(x,y),p=(b[s.bi]||0)>.5?1:0;
    s.sp+=(mg*7-s.sp)*.15;if(s.sp<.02)s.sp=0;if(s.sp){s.ang+=s.sp;s.W.setAttribute('transform','rotate('+s.ang.toFixed(1)+')')}
    if(x===s.lx&&y===s.ly&&p===s.lp)continue;s.lx=x;s.ly=y;s.lp=p;
    const dx=x*TRAVEL,dy=y*TRAVEL,sc=(1+mg*.035)*(p?.93:1);
    s.g.setAttribute('transform',`translate(${s.cx+dx} ${s.cy+dy+p*3}) scale(${sc})`);
    s.sh.setAttribute('transform',`translate(${5-x*7} ${10-y*7})`);
    s.hl.setAttribute('transform',`translate(${-x*7} ${-y*7})`);s.hi.setAttribute('transform',`translate(${x*4} ${y*4})`);
    s.grad.setAttribute('fx',.36-x*.16);s.grad.setAttribute('fy',.3-y*.16);
    s.d.style.opacity=mg*.65;s.k.style.opacity=p}
}
/* Demo: semua tombol -> LT -> RT -> kedua stik (cepat, lalu diam) -> jeda. Home tidak pernah ditekan. */
const DO=['a','b','x','y','lb','rb','view','menu','share','du','dd','dl','dr','l3','r3'];
function demo(t){const SEG=420,nB=DO.length*SEG,LT=1300,RT=1300,SK=1800,RS=1100,tot=nB+LT+RT+SK+RS;let u=t%tot;const b=[],ax=[0,0,0,0];
  if(u<nB){const k=DO[Math.floor(u/SEG)];b[k==='l3'?10:k==='r3'?11:IDX[k]]=1}
  else if((u-=nB)<LT)b[6]=Math.min(1,Math.sin(u/LT*Math.PI)*1.4);
  else if((u-=LT)<RT)b[7]=Math.min(1,Math.sin(u/RT*Math.PI)*1.4);
  else if((u-=RT)<SK){const p=u/SK,e=Math.sin(p*Math.PI),a=p*Math.PI*4;ax[0]=Math.cos(a)*e;ax[1]=Math.sin(a)*e;ax[2]=Math.sin(a)*e;ax[3]=Math.cos(a)*e}
  return[b,ax]}
/* Sentuh layar HP: tap tombol, tahan LT/RT, geser stik, tap stik = L3/R3 */
const T={b:[],ax:[0,0,0,0],n:0,last:-9999},PT={},svg=$('s');
const TBT={a:0,b:1,x:2,y:3,lb:4,rb:5,view:8,menu:9,du:12,dd:13,dl:14,dr:15,share:17,tlg:6,trg:7};
function hit(el){while(el&&el!==svg){if(el.id&&(el.id in TBT||el.id==='ls'||el.id==='rs'))return el.id;el=el.parentNode}return null}
function sp(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
svg.addEventListener('pointerdown',e=>{const id=hit(e.target);if(!id)return;e.preventDefault();try{svg.setPointerCapture(e.pointerId)}catch(_){}
  const p={id,t:performance.now(),mv:0};if(id==='ls'||id==='rs'){const q=sp(e);p.s=ST[id];p.x=q.x;p.y=q.y}else T.b[TBT[id]]=1;
  PT[e.pointerId]=p;T.n++});
svg.addEventListener('pointermove',e=>{const p=PT[e.pointerId];if(!p||!p.s)return;const q=sp(e);let x=(q.x-p.x)/70,y=(q.y-p.y)/70;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}
  p.mv=Math.max(p.mv,m);T.ax[p.s.ai]=x;T.ax[p.s.ai+1]=y});
function up(e){const p=PT[e.pointerId];if(!p)return;delete PT[e.pointerId];T.n--;T.last=performance.now();
  if(p.s){T.ax[p.s.ai]=T.ax[p.s.ai+1]=0;if(p.mv<.15&&performance.now()-p.t<300){const i=p.s.bi;T.b[i]=1;setTimeout(()=>{T.b[i]=0},220)}}else T.b[TBT[p.id]]=0}
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
(function loop(t){
  let p=null;const pads=navigator.getGamepads?navigator.getGamepads():[];
  for(const g of pads){if(!g||!g.connected)continue;if(g.mapping==='standard'){p=g;break}p=p||g}
  if(p)draw(p.buttons.map(x=>x.value||(x.pressed?1:0)),p.axes);
  else if(T.n>0||t-T.last<1500)draw(T.b,T.ax);
  else{const[d,a]=Q.has('demo')?demo(t):[[],[0,0,0,0]];draw(d,a)}
  requestAnimationFrame(loop);
})(0);
