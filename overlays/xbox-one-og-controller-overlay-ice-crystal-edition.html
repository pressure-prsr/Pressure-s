<script>
const Q=new URLSearchParams(location.search),R=document.documentElement.style,$=id=>document.getElementById(id);
function mix(h,t,a){const n=parseInt(h,16),c=[n>>16&255,n>>8&255,n&255].map(v=>Math.round(v+(t-v)*a));return'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')}
(function(){let a=(Q.get('accent')||'ff8a3d').replace('#','');if(!/^[0-9a-fA-F]{6}$/.test(a))a='ff8a3d';
 R.setProperty('--acc','#'+a);R.setProperty('--accHi',mix(a,255,.45));R.setProperty('--accLo',mix(a,0,.35));
 if(/^[0-9a-fA-F]{6}$/.test(Q.get('bg')||''))document.body.style.background='#'+Q.get('bg');
 const tl=parseFloat(Q.get('tilt'));if(tl)R.setProperty('--tx',tl+'deg');})();
const IDX={a:0,b:1,x:2,y:3,lb:4,rb:5,view:8,menu:9,du:12,dd:13,dl:14,dr:15};
const E={};for(const k in IDX)E[k]=$(k);
const YB=190,YT=-65,RG=YB-YT,TG={lt:{i:6,p:'tl'},rt:{i:7,p:'tr'}};
for(const k in TG){const t=TG[k],p=t.p;t.m=$(p+'m');t.f=$(p+'f');t.o=$(p+'o');t.cur=0;t.f.setAttribute('y',YT-10);t.f.setAttribute('height',YB+120-YT+10);}
const ST={ls:{cx:346.5,cy:486.0,ai:0,bi:10},rs:{cx:983.0,cy:720.5,ai:2,bi:11}};
for(const k in ST){const s=ST[k];s.g=$(k+'c');s.sh=$(k+'s');s.hl=$(k+'h');s.hi=$(k+'i');s.d=$(k+'d');s.k=$(k+'k');s.grad=$('g'+k);}
const TRAVEL=32,DZ=.09,FULL_AT=.96,T_FLOOR=.02;
// percikan bintang di ABXY
for(const k of['a','b','x','y']){const el=$(k),w=el.querySelector('.well'),n='http://www.w3.org/2000/svg',g=document.createElementNS(n,'g');
 g.setAttribute('transform',`translate(${w.getAttribute('cx')} ${w.getAttribute('cy')})`);
 let h='<g class="spk">';for(const[x,y]of[[40,-40],[-40,-40],[40,40],[-40,40]])h+=`<path transform="translate(${x} ${y}) scale(.6)" d="M0-14L3-3L14 0L3 3L0 14L-3 3L-14 0L-3-3Z" fill="#ffe3b8" stroke="#fff" stroke-width="3"/>`;
 g.innerHTML=h+'</g>';el.appendChild(g);}
function draw(b,ax){
  for(const k in IDX)E[k].classList.toggle('on',(b[IDX[k]]||0)>.5);
  $('dc').classList.toggle('on',!!(b[12]||b[13]||b[14]||b[15]));
  for(const k in TG){const t=TG[k],raw=Math.min(1,Math.max(0,b[t.i]||0)),tg=raw<T_FLOOR?0:raw>=FULL_AT?1:raw;
    t.cur+=(tg-t.cur)*(window.__freeze?1:.4);if(Math.abs(tg-t.cur)<.003)t.cur=tg;
    const v=t.cur,full=v>=.995,ty=full?-10:YB-RG*v-(YT-10),sh=`translate(0 ${(v*16).toFixed(2)})`;
    t.f.setAttribute('transform',`translate(0 ${ty.toFixed(1)})`);t.f.style.opacity=v>.004?1:0;
    t.m.setAttribute('transform',sh);t.o.setAttribute('transform',sh);t.o.style.opacity=full?1:v*.6;}
  for(const k in ST){const s=ST[k];let x=ax[s.ai]||0,y=ax[s.ai+1]||0;const m=Math.hypot(x,y);
    if(m<DZ){x=y=0}else if(m>1){x/=m;y/=m}
    const mg=Math.hypot(x,y),dx=x*TRAVEL,dy=y*TRAVEL,p=(b[s.bi]||0)>.5?1:0,sc=(1+mg*.035)*(p?.93:1);
    s.g.setAttribute('transform',`translate(${s.cx+dx} ${s.cy+dy+p*3}) scale(${sc})`);
    s.sh.setAttribute('transform',`translate(${5-x*7} ${10-y*7})`);
    s.hl.setAttribute('transform',`translate(${-x*7} ${-y*7})`);s.hi.setAttribute('transform',`translate(${x*4} ${y*4})`);
    s.grad.setAttribute('fx',.36-x*.16);s.grad.setAttribute('fy',.3-y*.16);
    s.d.style.opacity=mg*.65;s.k.style.opacity=p;}
}
// ===== fitur: spiral, Hack Terminal, hype, konami, meter langit, display Home =====
const spin=$('spin'),mk=$('mk'),nv=$('nv'),sun=$('sun'),moon=$('moon'),segs=[...document.querySelectorAll('.so')];
const KON='du,du,dd,dd,dl,dr,dl,dr,b,a',EX={l3:10,r3:11,lt:6,rt:7},KS=Object.keys(IDX).concat(Object.keys(EX));
let ang=0,spd=6,boost=0,br=0,mood=0,dm=-1,lastIn=0,hist=[],kon=[],prev={},hack={n:0,st:0,t:0,dn:-1,ds:-1};
function nova(){boost=80;nv.classList.remove('go');void nv.getBoundingClientRect();nv.classList.add('go')}
function press(k,t){hist.push(t);lastIn=t;mood=Math.min(1,mood+.02);kon.push(k);if(kon.length>10)kon.shift();
  if(kon.join()===KON){nova();kon=[]}
  if(!hack.st){hack.n++;if(hack.n>=10){hack.st=1;hack.t=t}}}
function logic(b,a,t,dt){
  let act=false;
  for(const k of KS){const i=IDX[k]!==undefined?IDX[k]:EX[k],on=(b[i]||0)>.5;if(on)act=true;if(on&&!prev[k])press(k,t);prev[k]=on}
  if(Math.hypot(a[0]||0,a[1]||0)>.3||Math.hypot(a[2]||0,a[3]||0)>.3||(b[6]||0)>.1||(b[7]||0)>.1)act=true;
  if(act)lastIn=t;
  while(hist.length&&t-hist[0]>1000)hist.shift();
  const hype=hist.length>8;
  if(hack.st&&t-hack.t>3500){hack.n=0;hack.st=0}
  if(hack.n!==hack.dn||hack.st!==hack.ds){segs.forEach((e,i)=>e.classList.toggle('on',i<hack.n));
    $('segDone').style.opacity=hack.st;$('ledG').style.opacity=hack.st;$('ledR').style.opacity=1-hack.st;hack.dn=hack.n;hack.ds=hack.st}
  mood=Math.max(0,mood-dt*.01);if(Math.abs(mood-dm)>.004){mk.setAttribute('transform',`translate(${699+144*mood} 759)`);dm=mood}
  boost=Math.max(0,boost-dt*60);spd+=((hype?42:6)+boost-spd)*Math.min(1,dt*3);ang=(ang+spd*dt)%360;
  br+=((t-lastIn>4000?1:0)-br)*Math.min(1,dt*1.5);
  spin.setAttribute('transform',`rotate(${ang.toFixed(2)}) scale(${(1+.03*br*(.5+.5*Math.sin(t/1200))).toFixed(4)})`);
}
function sky(){const d=new Date(),h=d.getHours()+d.getMinutes()/60;
  if(h>=6&&h<=18){const u=(h-6)/12;sun.setAttribute('transform',`translate(${770+(u-.5)*76} ${346-42*Math.sin(Math.PI*u)})`);sun.style.opacity=1;moon.style.opacity=0}
  else{sun.style.opacity=0;moon.setAttribute('transform','translate(792 312)');moon.style.opacity=1}}
sky();setInterval(sky,20000);
// ===== demo: tombol+trigger, lalu analog agak cepat, lalu diam =====
function demo(t){const order=[0,1,2,3,4,5,8,9,10,11,12,13,14,15],b=[],c=t%10800;let a=[0,0,0,0];
  if(c<6300){b[order[Math.floor(c/450)]]=1;b[6]=Math.max(0,Math.sin(t/800));b[7]=Math.max(0,Math.sin(t/800+Math.PI))}
  else if(c<9300){a=[Math.cos(c/350),Math.sin(c/350),Math.sin(c/450),Math.cos(c/450)]}
  return[b,a]}
// ===== sentuh / mouse (multi-touch) =====
const svg=$('s'),TS=new Map(),VB=[],VA=[0,0,0,0];
const MAP={a:0,b:1,x:2,y:3,lb:4,rb:5,view:8,menu:9,du:12,dd:13,dl:14,dr:15,tlg:6,trg:7};
function who(t){while(t&&t!==svg){if(t.id&&(MAP[t.id]!==undefined||t.id==='ls'||t.id==='rs'))return t.id;t=t.parentNode}return null}
function rebuild(){VB.length=0;VA.fill(0);for(const o of TS.values()){if(o.id==='ls'||o.id==='rs'){const s=ST[o.id];if(o.drag){VA[s.ai]=o.x;VA[s.ai+1]=o.y}else VB[s.bi]=1}else VB[MAP[o.id]]=1}}
function upd(e){const o=TS.get(e.pointerId);if(!o)return;
  if(o.id==='ls'||o.id==='rs'){const s=ST[o.id],q=svg.createSVGPoint();q.x=e.clientX;q.y=e.clientY;const p=q.matrixTransform(svg.getScreenCTM().inverse()),dx=(p.x-s.cx)/TRAVEL,dy=(p.y-s.cy)/TRAVEL,m=Math.hypot(dx,dy);
    if(o.drag||m>.25){o.drag=true;const k=m>1?1/m:1;o.x=dx*k;o.y=dy*k}}
  rebuild()}
svg.addEventListener('pointerdown',e=>{const id=who(e.target);if(!id)return;e.preventDefault();try{svg.setPointerCapture(e.pointerId)}catch(_){}TS.set(e.pointerId,{id,drag:false,x:0,y:0});upd(e)});
svg.addEventListener('pointermove',upd);
for(const n of['pointerup','pointercancel'])svg.addEventListener(n,e=>{TS.delete(e.pointerId);rebuild()});
let last=0;
(function loop(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(!window.__freeze){
    let p=null,b,a;const pads=navigator.getGamepads?navigator.getGamepads():[];
    for(const g of pads){if(!g||!g.connected)continue;if(g.mapping==='standard'){p=g;break}p=p||g}
    if(p){b=p.buttons.map(x=>x.value||(x.pressed?1:0));a=p.axes}
    else if(Q.has('demo')){[b,a]=demo(t)}else{b=VB.slice();a=VA.slice()}
    draw(b,a);logic(b,a,t,dt);
  }
  requestAnimationFrame(loop);
})(0);
