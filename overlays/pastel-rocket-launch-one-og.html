for(const k in IDX)TGT[k]={i:IDX[k]};
function svgPt(e){const p=S.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(S.getScreenCTM().inverse())}
function hit(e){let n=e.target;while(n&&n!==S){if(n.id&&TGT[n.id])return TGT[n.id];n=n.parentNode}return null}
S.addEventListener('pointerdown',e=>{const h=hit(e);if(!h)return;e.preventDefault();try{S.setPointerCapture(e.pointerId)}catch(_){}
  const o={h,p0:svgPt(e),drag:0};PT.set(e.pointerId,o);
  if(h.s)VB[ST[h.s].bi]=1;else VB[h.i]=1});
S.addEventListener('pointermove',e=>{const o=PT.get(e.pointerId);if(!o||!o.h.s)return;const p=svgPt(e),dx=(p.x-o.p0.x)/55,dy=(p.y-o.p0.y)/55,s=ST[o.h.s];
  if(!o.drag&&Math.hypot(dx,dy)>.2){o.drag=1;VB[s.bi]=0}
  if(o.drag){const m=Math.hypot(dx,dy),c=m>1?1/m:1;VA[s.ai]=dx*c;VA[s.ai+1]=dy*c}});
function up(e){const o=PT.get(e.pointerId);if(!o)return;PT.delete(e.pointerId);
  if(o.h.s){const s=ST[o.h.s];VB[s.bi]=0;VA[s.ai]=VA[s.ai+1]=0}else VB[o.h.i]=0}
S.addEventListener('pointerup',up);S.addEventListener('pointercancel',up);
window.addEventListener('blur',()=>{PT.clear();VB.length=0;VA.fill(0)});
(function loop(t){
  if(!window.__freeze){
    let p=null;const pads=navigator.getGamepads?navigator.getGamepads():[];
    for(const g of pads){if(!g||!g.connected)continue;if(g.mapping==='standard'){p=g;break}p=p||g}
    let b,a;
    if(p){b=p.buttons.map(x=>x.value||(x.pressed?1:0));a=p.axes}
    else if(Q.has('demo'))[b,a]=demo(t);
    else{b=VB;a=VA}
    draw(b,a);game(b,a,t);
  }
  requestAnimationFrame(loop);
})(0);
</script></body></html>
