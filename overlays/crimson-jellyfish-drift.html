<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Xbox Series X - Overlay Crimson Jellyfish Drift 3D</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--acc:#ff4d5e;--accHi:#ff9da6;--accLo:#a6323d;--tilt:0deg}
html,body{margin:0;background:transparent;height:100%;-webkit-tap-highlight-color:transparent}
#wrap{perspective:1600px}
svg{display:block;width:100%;height:auto;max-height:100vh;transform:rotateX(var(--tilt));touch-action:none;user-select:none;-webkit-user-select:none}
.sHi{stop-color:var(--accHi)}.sMid{stop-color:var(--acc)}.sLo{stop-color:var(--accLo)}
.cap,.arm path{transition:transform .05s}
.cap,.o{transform-box:fill-box;transform-origin:center}
.body-rim{fill:none;stroke:url(#gRim);stroke-width:3}
.well,.wellp{fill:url(#gWell);stroke:#4d0720;stroke-opacity:.45;stroke-width:1.5}
.wellp{stroke:#7E0F31;stroke-opacity:1;stroke-width:14;stroke-linejoin:round;paint-order:stroke}
.cs{fill:#5a0a22;fill-opacity:.4}
.dome{fill:url(#gDome);stroke:#8A0F30;stroke-opacity:.4;stroke-width:1.5}
.spec{fill:#fff;fill-opacity:.4}
.ring{fill:none;stroke:#8A0F30;stroke-opacity:.18;stroke-width:3}
.glow,.glowp{fill:none;stroke:var(--acc);stroke-width:7;opacity:0;stroke-linejoin:round}
.armp{fill:url(#gArm);stroke:#8A0F30;stroke-opacity:.35;stroke-width:1.5;stroke-linejoin:round}
.armo{fill:url(#gArmOn);opacity:0;stroke:var(--acc);stroke-width:2;stroke-linejoin:round}
text{font:600 52px system-ui,"Segoe UI",Roboto,sans-serif;text-anchor:middle}
.g{fill:#8A0F30}.gs{fill:#fff;fill-opacity:.55}
.i{fill:none;stroke:#8A0F30;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.p.on .cap{transform:translateY(3px) scale(.965)}
.p.on .dome,.p.on .armp{fill:url(#gDomeOn);stroke:var(--accHi);stroke-opacity:.6}
.p.on .glow,.p.on .glowp{opacity:.4}
.p.on .cs{fill-opacity:.18}
.p.on .g,.p.on .i{fill:#4a0618;stroke:#4a0618}.p.on text.g{stroke:none}
.p.on .i{fill:none}
.p.on .gs{fill:#fff;fill-opacity:.4}
.p.on .ring{stroke:#000;stroke-opacity:.25}
.p.on .spec{fill-opacity:.28}
.arm.on path.armp{transform:translateY(2px)}
.arm.on .armo{opacity:1;transform:translateY(2px)}
.tbase{fill:url(#gTrg);stroke:#8A0F30;stroke-opacity:.35;stroke-width:2}
.trim{fill:none;stroke:#fff;stroke-opacity:.3;stroke-width:2.5;stroke-linejoin:round}
.tbody{fill:url(#gTrgH);stroke:#8A0F30;stroke-opacity:.45;stroke-width:2}
.tao{fill:url(#gTrgAO)}
.trimT{fill:none;stroke:#fff;stroke-opacity:.4;stroke-width:2.5;stroke-linejoin:round}
.tglow{fill:none;stroke:var(--acc);stroke-width:12;stroke-linejoin:round;opacity:0}
.tfill{fill:url(#gAccV);opacity:0}
.tick{stroke:#8A0F30;stroke-opacity:.25;stroke-width:2}
.tlab{font:800 34px system-ui,"Segoe UI",sans-serif;fill:#FFF3E8;text-anchor:middle;paint-order:stroke;stroke:#8A0F30;stroke-width:6;stroke-linejoin:round}
.bbase{fill:url(#gBmp)}.btrim{fill:none;stroke:#fff;stroke-opacity:.4;stroke-width:2.5;stroke-linejoin:round}
.bon{fill:url(#gAccV);opacity:0}.bmp.on .bon{opacity:1}.bmp.on .cap{transform:translateY(3px)}
.sweep{fill:#FFF3E8;opacity:0}
.bmp.on .sweep{animation:sw .5s ease-out}
@keyframes sw{0%{opacity:.85;transform:translateX(0)}100%{opacity:0;transform:translateX(430px)}}
.swell{fill:url(#gWell);stroke:#fff;stroke-opacity:.25;stroke-width:3}
.hole{fill:url(#gHole);stroke:url(#gHoleRim);stroke-width:3}.holeS{fill:url(#gHoleS)}
.dring{fill:none;stroke:var(--acc);stroke-width:5;opacity:0}
.csh{fill:#5a0a22;fill-opacity:.4}
.gr1{fill:none;stroke:#fff;stroke-opacity:.25;stroke-width:3}.gr2{fill:none;stroke:#4d0720;stroke-opacity:.4;stroke-width:3}
.drim{fill:none;stroke:url(#gDRim);stroke-width:4}
.hlc{fill:none;stroke:url(#gHlArc);stroke-linecap:round}
.dhl{fill:none;stroke:url(#gDhArc);stroke-linecap:round}
.kring{fill:none;stroke:var(--acc);stroke-width:6;opacity:0}
.plate{stroke:#4d0720;stroke-opacity:.45;stroke-width:2}
.dish{fill:url(#gDpad);stroke:#fff;stroke-opacity:.25;stroke-width:3}
/* ---- tema Crimson Jellyfish Drift ---- */
.rip{fill:none;stroke:#FFF3E8;stroke-width:4;opacity:0}
.bub{fill:#fff;fill-opacity:.18;stroke:#FFF3E8;stroke-width:2.5;opacity:0}
.pb{fill:none;stroke:#FFF3E8;stroke-opacity:.22;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.pc{fill:none;stroke:#FFF3E8;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.mood{opacity:0;transition:opacity 1.3s}
.mN{fill:#4B1058;fill-opacity:.22}.mD{fill:#FFF1C9;fill-opacity:.24}
.drift{animation:drift 20s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(-11px,-6px)}100%{transform:translate(11px,6px)}}
#home{transition:opacity 1s}
#s.sleep #home{opacity:.65}
@media (prefers-reduced-motion:reduce){.drift{animation:none}}

<script>
const Q=new URLSearchParams(location.search),R=document.documentElement.style;
function mix(h,t,a){const n=parseInt(h,16),c=[n>>16&255,n>>8&255,n&255].map(v=>Math.round(v+(t-v)*a));return'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')}
(function(){let a=(Q.get('accent')||'ff4d5e').replace('#','');if(!/^[0-9a-fA-F]{6}$/.test(a))a='ff4d5e';
 R.setProperty('--acc','#'+a);R.setProperty('--accHi',mix(a,255,.45));R.setProperty('--accLo',mix(a,0,.35));
 if(/^[0-9a-fA-F]{6}$/.test(Q.get('bg')||''))document.body.style.background='#'+Q.get('bg');
 const tl=parseFloat(Q.get('tilt'));if(tl>0)R.setProperty('--tilt',Math.min(45,tl)+'deg');})();
const THEME=['day','dusk','night'].includes(Q.get('theme'))?Q.get('theme'):null;   // ?theme=day|dusk|night mengunci suasana laut
const IDLE=(parseFloat(Q.get('idle'))||8)*1000,DEMO=Q.has('demo');
const IDX={a:0,b:1,x:2,y:3,lb:4,rb:5,view:8,menu:9,du:12,dd:13,dl:14,dr:15,share:17};   // Home (16) hanya display
const BTN=[0,1,2,3,4,5,8,9,10,11,12,13,14,15,17];
const $=id=>document.getElementById(id),E={},svg=$('s');for(const k in IDX)E[k]=$(k);
const YB=62,YT=-150,RG=YB-YT;
const TG={lt:{i:6,p:'tl'},rt:{i:7,p:'tr'}};
for(const k in TG){const t=TG[k],p=t.p;t.m=$(p+'m');t.f=$(p+'f');t.o=$(p+'o');t.cur=0}
const ST={ls:{cx:354.0,cy:418.0,ai:0,bi:10},rs:{cx:976.5,cy:646.5,ai:2,bi:11}};
const NS='http://www.w3.org/2000/svg';
for(const k in ST){const s=ST[k];s.root=$(k);s.g=$(k+'c');s.sh=$(k+'s');s.hl=$(k+'h');s.hi=$(k+'i');s.d=$(k+'d');s.k=$(k+'k');s.grad=$('g'+k);
  s.ang=null;s.acc=0;s.last=0;s.bn=0;s.bt=0;s.bub=[];
  for(let i=0;i<9;i++){const g=document.createElementNS(NS,'g'),c=document.createElementNS(NS,'circle');c.setAttribute('class','bub o');c.setAttribute('r',5+(i%3)*2);g.appendChild(c);s.root.appendChild(g);s.bub.push({g,c})}}
const TRAVEL=42,DZ=.09;
const FULL_AT=.96,T_FLOOR=.02;
// ---------- efek kecil ----------
const RIPK={0:'a',1:'b',2:'x',3:'y',8:'view',9:'menu'},RIPE={};
for(const i in RIPK)RIPE[i]=E[RIPK[i]].querySelector('.rip');
for(const i of [12,13,14,15])RIPE[i]=$('dpr');
function ripple(i){const e=RIPE[i];if(e)e.animate([{transform:'scale(1)',opacity:.8},{transform:'scale(1.6)',opacity:0}],{duration:420,easing:'ease-out'})}
const whirl=$('whirl');let whCool=0;
function whirlGo(now){if(now<whCool)return;whCool=now+4200;
  whirl.animate([{opacity:0,transform:'rotate(0deg) scale(.45)'},{opacity:.9,transform:'rotate(150deg) scale(.85)',offset:.25},{opacity:.8,transform:'rotate(330deg) scale(1.05)',offset:.75},{opacity:0,transform:'rotate(480deg) scale(1.25)'}],{duration:2600,easing:'ease-in-out'})}
// ---------- gambar tiap frame ----------
function draw(b,ax,now){
  for(const k in IDX)E[k].classList.toggle('on',(b[IDX[k]]||0)>.5);
  $('dc').classList.toggle('on',!!(b[12]||b[13]||b[14]||b[15]));
  for(const k in TG){const t=TG[k],raw=Math.min(1,Math.max(0,b[t.i]||0)),tg=raw<T_FLOOR?0:raw>=FULL_AT?1:raw;
    t.cur+=(tg-t.cur)*(window.__freeze?1:.4);if(Math.abs(tg-t.cur)<.003)t.cur=tg;
    const v=t.cur,full=v>=.995,fy=full?YT-10:YB-RG*v,sh=`translate(0 ${(v*16).toFixed(2)})`;
    t.f.setAttribute('transform',`translate(0 ${(fy+160).toFixed(1)})`);t.f.style.opacity=v>.01?1:0;   // isi naik seperti ubur-ubur (transform + opacity)
    t.m.setAttribute('transform',sh);t.o.setAttribute('transform',sh);
    t.o.style.opacity=full?.5:v*.35}
  for(const k in ST){const s=ST[k];let x=ax[s.ai]||0,y=ax[s.ai+1]||0;const m=Math.hypot(x,y);
    if(m<DZ){x=y=0}else if(m>1){x/=m;y/=m}
    const mg=Math.hypot(x,y),dx=x*TRAVEL,dy=y*TRAVEL,p=(b[s.bi]||0)>.5?1:0,sc=(1+mg*.035)*(p?.93:1);
    s.g.setAttribute('transform',`translate(${s.cx+dx} ${s.cy+dy+p*3}) scale(${sc})`);
    s.sh.setAttribute('transform',`translate(${5-x*7} ${10-y*7})`);
    s.hl.setAttribute('transform',`translate(${-x*7} ${-y*7})`);s.hi.setAttribute('transform',`translate(${x*4} ${y*4})`);
    s.grad.setAttribute('fx',.36-x*.16);s.grad.setAttribute('fy',.3-y*.16);
    s.d.style.opacity=mg*.65;s.k.style.opacity=p;
    // jejak gelembung
    if(mg>.5&&now-s.bt>110){s.bt=now;const o=s.bub[s.bn++%s.bub.length];
      o.g.setAttribute('transform',`translate(${(s.cx+dx-x*66+(Math.random()-.5)*34).toFixed(1)} ${(s.cy+dy-y*66+(Math.random()-.5)*34).toFixed(1)})`);
      o.c.animate([{transform:'translate(0px,0px) scale(.6)',opacity:.9},{transform:'translate(0px,-46px) scale(1.25)',opacity:0}],{duration:900,easing:'ease-out'})}
    // easter egg: putar stik 360 derajat -> pusaran air
    const rx=ax[s.ai]||0,ry=ax[s.ai+1]||0;
    if(Math.hypot(rx,ry)>.6){const a=Math.atan2(ry,rx);
      if(s.ang!==null&&now-s.last<350){let d=a-s.ang;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;s.acc+=d;if(Math.abs(s.acc)>=5.9){s.acc=0;whirlGo(now)}}else s.acc=0;
      s.ang=a;s.last=now}
    else if(Math.hypot(rx,ry)<.35){s.ang=null;s.acc=0}}
}
// ---------- meter arus laut, suasana laut, idle ----------
const pcL=[],pcR=[],pcP=[];for(let i=0;i<6;i++){pcL.push($('pcl'+i));pcR.push($('pcr'+i));pcP.push(-1)}
const moodN=$('moodN'),moodD=$('moodD');
let prevB=[],heat=0,lastIn=performance.now(),sleeping=false,mood='dusk';
function fx(b,ax,now,dt){
  let pr=0,act=false;
  for(const i of BTN){const on=(b[i]||0)>.5;if(on){act=true;if(!prevB[i]){pr++;ripple(i)}}prevB[i]=on}
  for(const i of [6,7]){const on=(b[i]||0)>.5;if(on){act=true;if(!prevB[i])pr++}prevB[i]=on}
  if(Math.hypot(ax[0]||0,ax[1]||0)>.15||Math.hypot(ax[2]||0,ax[3]||0)>.15)act=true;
  heat=Math.min(30,heat+pr)*Math.exp(-dt/3500);
  if(act)lastIn=now;
  const sl=now-lastIn>IDLE;if(sl!==sleeping){sleeping=sl;svg.classList.toggle('sleep',sl)}
  let m=sleeping?'night':(heat>=5||(mood==='day'&&heat>3))?'day':'dusk';if(THEME)m=THEME;
  if(m!==mood){mood=m;moodN.style.opacity=m==='night'?1:0;moodD.style.opacity=m==='day'?1:0}
  const lv=Math.min(1,heat/8);
  for(let i=0;i<6;i++){const r=Math.round(Math.max(0,Math.min(1,lv*6-i))*20)/20;if(r!==pcP[i]){pcP[i]=r;pcL[i].style.opacity=r;pcR[i].style.opacity=r}}
  clock();
}
// ---------- jam analog gelembung (waktu nyata) ----------
const ckH=$('ckH'),ckM=$('ckM'),ckS=$('ckS');
function clock(){const d=new Date(),s=d.getSeconds()+d.getMilliseconds()/1000,m=d.getMinutes()+s/60,h=d.getHours()%12+m/60;
  ckH.setAttribute('transform','rotate('+(h*30).toFixed(1)+')');ckM.setAttribute('transform','rotate('+(m*6).toFixed(1)+')');ckS.setAttribute('transform','rotate('+(s*6).toFixed(1)+')')}
// ---------- demo: semua tombol, trigger, analog (looping; analog cepat lalu diam; Home tidak pernah ditekan) ----------
function demo(t){const c=t%16500,b=[];let a=[0,0,0,0];
  if(c<7200)b[BTN[Math.floor(c/480)]]=1;
  else if(c<11200){const x=(c-7200)/4000*4*Math.PI;b[6]=Math.max(0,Math.sin(x));b[7]=Math.max(0,-Math.sin(x))}
  else if(c<14200){const g=(c-11200)/800*2*Math.PI;a=[Math.cos(g),Math.sin(g),Math.cos(-g+1),Math.sin(-g+1)]}
  return[b,a]}
// ---------- sentuh / mouse (multi-touch) ----------
const VB={},VA={};
const SEL='#a,#b,#x,#y,#lb,#rb,#view,#menu,#share,#du,#dd,#dl,#dr,#tlg,#trg,#ls,#rs',PI=new Map();
svg.addEventListener('pointerdown',e=>{const el=e.target.closest(SEL);if(!el)return;e.preventDefault();svg.setPointerCapture(e.pointerId);const id=el.id;
  if(id==='ls'||id==='rs')PI.set(e.pointerId,{t:'s',k:id,x0:e.clientX,y0:e.clientY,mv:0});
  else{const i=id==='tlg'?6:id==='trg'?7:IDX[id];VB[i]=1;PI.set(e.pointerId,{t:'b',i})}});
svg.addEventListener('pointermove',e=>{const p=PI.get(e.pointerId);if(!p||p.t!=='s')return;
  const sc=(svg.getScreenCTM()||{a:1}).a||1,Rg=TRAVEL*2.4*sc;let x=(e.clientX-p.x0)/Rg,y=(e.clientY-p.y0)/Rg;const m=Math.hypot(x,y);
  if(m>1){x/=m;y/=m}if(m*Rg>7*sc)p.mv=1;VA[p.k]=[x,y]});
function rel(e){const p=PI.get(e.pointerId);if(!p)return;PI.delete(e.pointerId);
  if(p.t==='b')VB[p.i]=0;else{VA[p.k]=null;if(!p.mv){const bi=ST[p.k].bi;VB[bi]=1;setTimeout(()=>{VB[bi]=0},160)}}}
svg.addEventListener('pointerup',rel);svg.addEventListener('pointercancel',rel);
// ---------- loop ----------
let lastT=0;
(function loop(t){
  const dt=Math.min(64,t-lastT||16);lastT=t;
  if(!window.__freeze){
    let p=null,b,a;const pads=navigator.getGamepads?navigator.getGamepads():[];
    for(const g of pads){if(!g||!g.connected)continue;if(g.mapping==='standard'){p=g;break}p=p||g}
    if(p){b=p.buttons.map(x=>x.value||(x.pressed?1:0));a=Array.from(p.axes)}
    else if(DEMO){[b,a]=demo(t)}else{b=[];a=[0,0,0,0]}
    for(const i in VB)if(VB[i])b[i]=1;
    if(VA.ls){a[0]=VA.ls[0];a[1]=VA.ls[1]}if(VA.rs){a[2]=VA.rs[0];a[3]=VA.rs[1]}
    draw(b,a,t);fx(b,a,t,dt);
  }
  requestAnimationFrame(loop);
})(0);
