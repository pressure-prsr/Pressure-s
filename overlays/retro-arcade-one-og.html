<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Retro Arcade - Xbox One OG - Overlay 3D</title>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>
:root{--acc:#ff3db8;--accHi:#ffa5dc;--accLo:#a3246f}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center}
svg{display:block;width:100%;height:auto;max-height:100vh;touch-action:none;pointer-events:none}
[data-in]{pointer-events:auto}
.sHi{stop-color:var(--accHi)}.sMid{stop-color:var(--acc)}.sLo{stop-color:var(--accLo)}
.cap,.arm path,.arr,.arrB{transition:transform .05s}
.cap{transform-box:fill-box;transform-origin:center}
.body-rim{fill:none;stroke:url(#gRim);stroke-width:3}
.panel{fill:url(#gPlate);stroke:#A6FEFF;stroke-opacity:.4;stroke-width:2.5;stroke-linejoin:round}
.plate{stroke:#A6FEFF;stroke-opacity:.35;stroke-width:2}
.mic{fill:none;stroke:#A6FEFF;stroke-opacity:.6;stroke-width:2.5;stroke-linecap:round}
.bulbS{fill:#14093F;stroke:#A6FEFF;stroke-opacity:.5;stroke-width:1.5}
/* tombol */
.well{fill:url(#gWell);stroke:#0F0842;stroke-opacity:.6;stroke-width:1.5}
.ab .well{fill:#0B0536;stroke:#A6FEFF;stroke-opacity:.75;stroke-width:3}
.sm .well{fill:#0B0536;stroke:#A6FEFF;stroke-opacity:.7;stroke-width:2.5}
.glow{fill:none;stroke:var(--acc);stroke-width:7;opacity:0}
.cs{fill:#0B0630;fill-opacity:.55}
.cside{stroke:#0F0842;stroke-opacity:.6;stroke-width:2}
.rimhl{fill:none;stroke:#fff;stroke-opacity:.35;stroke-width:2.5}
.flash{fill:#fff;opacity:0}
.sm .dome{fill:url(#gDome);stroke:#A6FEFF;stroke-opacity:.5;stroke-width:1.5}
.spec{fill:#fff;fill-opacity:.16}
.i{fill:none;stroke:#FFE23D;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.p.on .glow{opacity:.9}
.p.on .flash{opacity:.34}
.p.on .cap{transform:translateY(3px) scale(.965)}
.p.on .cs{fill-opacity:.2}
.sm.on .dome{fill:url(#gDomeOn);stroke:var(--accHi)}
.sm.on .i{stroke:#14093F}
/* d-pad */
.dish{fill:url(#gDpad);stroke:#A6FEFF;stroke-opacity:.5;stroke-width:3}
.armp{fill:url(#gArm);stroke:#A6FEFF;stroke-opacity:.35;stroke-width:1.5;stroke-linejoin:round}
.armo{fill:url(#gArmOn);opacity:0;stroke:var(--acc);stroke-width:2;stroke-linejoin:round}
.arm.on path.armp{transform:translateY(2px)}
.arm.on .armo{opacity:1;transform:translateY(2px)}
.arr{fill:#C9BEFF;opacity:.9}.arrB{fill:#FFE23D;opacity:0;transform-box:fill-box;transform-origin:center}
.arm.on .arr{transform:translateY(2px)}.arm.on .arrB{opacity:1;transform:translateY(2px) scale(1.12)}
/* bumper */
.bback{fill:#0E5AA8;stroke:#0F0842;stroke-opacity:.5;stroke-width:2.5;stroke-linejoin:round}
.bbase{fill:url(#gBmp)}
.btrim{fill:none;stroke:#fff;stroke-opacity:.55;stroke-width:2.5;stroke-linejoin:round}
.bon{fill:url(#gAccV);opacity:0}
.bmp.on .bon{opacity:.42}.bmp.on .bon.bon2{opacity:.2}
.bmp.on .cap{transform:translateY(2px)}
.ledS{fill:#14093F;fill-opacity:.85;stroke:#A6FEFF;stroke-opacity:.5;stroke-width:1.5}
.led{opacity:0;transition:opacity 0s linear 0s}
.bmp.on .led{opacity:1}.bmp.on .l2{transition-delay:.06s}.bmp.on .l3{transition-delay:.12s}
/* trigger */
.tbody{fill:url(#gTrgH);stroke:#0F0842;stroke-opacity:.7;stroke-width:2}
.tao{fill:url(#gTrgAO)}
.trimT{fill:none;stroke:#A6FEFF;stroke-opacity:.5;stroke-width:2.5;stroke-linejoin:round}
.tglow{fill:none;stroke:var(--acc);stroke-width:12;stroke-linejoin:round;opacity:0}
.tick{stroke:#14093F;stroke-opacity:.28;stroke-width:1.5}
.tlab{fill:#fff;stroke:#14093F;stroke-width:5;stroke-linejoin:miter;paint-order:stroke}
.seg{opacity:0}
/* stik */
.swell{fill:url(#gWell);stroke:#A6FEFF;stroke-opacity:.35;stroke-width:3}
.hole{fill:url(#gHole);stroke:url(#gHoleRim);stroke-width:3}
.holeS{fill:url(#gHoleS)}
.dring{fill:none;stroke:var(--acc);stroke-width:5;opacity:0}
.csh{fill:#0B0630;fill-opacity:.5}
.gr1{fill:none;stroke:#fff;stroke-opacity:.22;stroke-width:3}
.gr2{fill:none;stroke:#5A0A3A;stroke-opacity:.5;stroke-width:3}
.drim{fill:none;stroke:url(#gDRim);stroke-width:4}
.hl,.hlc{fill:none;stroke:url(#gHlArc);stroke-linecap:round}
.dhl{fill:none;stroke:url(#gDhArc);stroke-linecap:round}
.kring{fill:none;stroke:var(--acc);stroke-width:6;stroke-dasharray:16 10;opacity:0}
.pxs rect{fill:#fff;fill-opacity:.85}
.trl{opacity:0}
.sq{opacity:0}
/* meter */
.cover{transform-box:fill-box;transform-origin:50% 0}
.mglow{fill:none;stroke:var(--acc);stroke-width:6;opacity:0}
.mfull .mglow{animation:alt .3s steps(1,end) infinite}
#mH,#mS,#mZ,#mL,#zz{opacity:0}
/* animasi pixel: hanya transform/opacity, bertahap (steps) */
@keyframes tw{0%{opacity:.12}50%{opacity:1}}
@keyframes alt{0%{opacity:1}50%{opacity:0}}
@keyframes alt2{0%{opacity:0}50%{opacity:1}}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes hov{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes jit{0%{transform:translateX(-2px)}50%{transform:translateX(2px)}}
@keyframes up{to{transform:translateY(-12px)}}
@keyframes dn{to{transform:translateY(8px)}}
@keyframes zf{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-20px);opacity:0}}
@keyframes bl{0%{opacity:1}92%{opacity:0}}
@keyframes bl2{0%{opacity:0}92%{opacity:1}}
.st{animation:tw calc(var(--d,1.6s) * var(--spd,1)) steps(1,end) infinite;animation-delay:var(--l,0s)}
.bu1{animation:alt 1s steps(1,end) infinite}.bu2{animation:alt2 1s steps(1,end) infinite}
.hov{animation:hov 2s steps(1,end) infinite}.ufo{animation:hov 2.4s steps(1,end) infinite}
.fl1{animation:alt .3s steps(1,end) infinite}.fl2{animation:alt2 .3s steps(1,end) infinite}
.lt1{animation:alt .8s steps(1,end) infinite}.lt2{animation:alt2 .8s steps(1,end) infinite}
.mbob{animation:bob 1s steps(1,end) infinite}.sl .mbob{animation-duration:2.6s}
.jit{animation:jit .2s steps(1,end) infinite}
.eyes{animation:bl 3.6s steps(1,end) infinite}.shut{opacity:0;animation:bl2 3.6s steps(1,end) infinite}
.zz1{animation:zf 2.4s steps(6,end) infinite}.zz2{animation:zf 2.4s steps(6,end) 1.2s infinite}
.lvA{animation:alt .5s steps(1,end) infinite}.lvB{animation:alt2 .5s steps(1,end) infinite}
.sunst{animation:up 3s steps(6,end) infinite}.grid{animation:dn 1.6s steps(4,end) infinite}
</style></head><body>

function mix(h,t,a){const n=parseInt(h,16),c=[n>>16&255,n>>8&255,n&255].map(v=>Math.round(v+(t-v)*a));return'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')}
{let a=(Q.get('accent')||'ff3db8').replace('#','');if(!hex6.test(a))a='ff3db8';
 R.setProperty('--acc','#'+a);R.setProperty('--accHi',mix(a,255,.45));R.setProperty('--accLo',mix(a,0,.35));
 const bg=(Q.get('bg')||'').replace('#','');if(hex6.test(bg))document.body.style.background='#'+bg;}
const svg=$('s');
if(Q.has('tilt')){let d=parseFloat(Q.get('tilt'));if(!isFinite(d)||!d)d=10;svg.style.transform='perspective(1600px) rotateX('+d+'deg) rotateY('+(-d*.5)+'deg)';}
const IDLE=Math.max(1,parseFloat(Q.get('idle'))||20)*1000,DEMO=Q.has('demo');
const IDX={a:0,b:1,x:2,y:3,lb:4,rb:5,view:8,menu:9,du:12,dd:13,dl:14,dr:15};
const E={};for(const k in IDX)E[k]=$(k);
const on={},DC=$('dc'),TRAVEL=42,DZ=.09;let dcOn=false;
const TG=[['tl',6],['tr',7]].map(([p,i])=>({i,m:$(p+'m'),o:$(p+'o'),segs:[...$(p+'f').children],cur:0,lit:-1,sh:'',go:-1}));
const ST=[['ls',0,10,346.5,486],['rs',2,11,983,720.5]].map(([k,ai,bi,cx,cy])=>({ai,bi,cx,cy,g:$(k+'c'),sh:$(k+'s'),hl:$(k+'h'),hi:$(k+'i'),d:$(k+'d'),kr:$(k+'k'),tr:[0,1,2,3].map(i=>$(k+'t'+i)),key:'',ux:0,uy:1,amt:0,tk:'',kv:-1,dv:-1}));
const MF={n:$('mN'),h:$('mH'),s:$('mS'),z:$('mZ'),l:$('mL')},ZZ=$('zz'),MC=$('mcov'),METER=$('meter');
const COINS=[...$('coins').children],BURST=[...$('burst').children],SP={};
for(const k of['a','b','x','y'])SP[k]=[...$('sp'+k).children];
let mst='',coinAn=[],konActive=false;
function setM(st){if(st===mst)return;mst=st;for(const k in MF)MF[k].style.opacity=k===st?1:0;ZZ.style.opacity=st==='z'?1:0;svg.classList.toggle('sl',st==='z')}
function startCoins(){stopCoins();konActive=true;COINS.forEach((c,i)=>coinAn.push(c.animate([{transform:'translateY(0px)',opacity:1},{transform:'translateY(130px)',opacity:1}],{duration:700+(i%4)*160,delay:(i*90)%500,iterations:Infinity,easing:'steps(7,end)'})))}
function stopCoins(){coinAn.forEach(a=>a.cancel());coinAn=[];konActive=false}
function burst(){BURST.forEach((r,i)=>{const a=i/8*Math.PI*2+.4;r.animate([{transform:'translate(0px,0px) scale(1)',opacity:1},{transform:'translate('+Math.cos(a)*50+'px,'+Math.sin(a)*50+'px) scale(.3)',opacity:0}],{duration:520,easing:'steps(6,end)'})})}
function spark(k){SP[k].forEach((q,i)=>{const a=(-90+i*60+(i%2?18:-12))*Math.PI/180,d=52+(i%3)*10;q.animate([{transform:'translate(0px,0px) scale(1)',opacity:1},{transform:'translate('+Math.cos(a)*d+'px,'+Math.sin(a)*d+'px) scale(.35)',opacity:0}],{duration:300,easing:'steps(5,end)'})})}
const KON=['du','du','dd','dd','dl','dr','dl','dr','b','a'],KSET=new Set(['du','dd','dl','dr','a','b']),SPK=new Set(['a','b','x','y']);
let count=0,combo=0,dispC=0,lastPress=-1e9,lastAct=0,lvlUntil=0,konUntil=0,konSeq=[],mcv='',mfull=false,spdv=-1;
function press(name,now){
 lastAct=now;count++;combo=Math.min(12,combo+1.4);lastPress=now;
 if(SPK.has(name))spark(name);
 if(KSET.has(name)){konSeq.push(name);if(konSeq.length>10)konSeq.shift();
  if(konSeq.length===10&&konSeq.every((v,i)=>v===KON[i])){konUntil=now+4000;konSeq=[];startCoins()}}
 if(count%100===0){lvlUntil=now+2200;burst()}
}
function draw(b,ax,now,dt){
 let act=false;
 for(const k in IDX){const v=(b[IDX[k]]||0)>.5;if(v)act=true;if(v!==on[k]){on[k]=v;E[k].classList.toggle('on',v);if(v)press(k,now)}}
 const dp=!!(on.du||on.dd||on.dl||on.dr);if(dp!==dcOn){dcOn=dp;DC.classList.toggle('on',dp)}
 let trigMax=false;
 for(const t of TG){const raw=Math.min(1,Math.max(0,b[t.i]||0)),tg=raw<.02?0:raw;
  t.cur+=(tg-t.cur)*.45;if(Math.abs(tg-t.cur)<.004)t.cur=tg;const v=t.cur;
  if(raw>.02)act=true;if(v>=.9)trigMax=true;
  const sh='translate(0 '+(v*16).toFixed(1)+')';
  if(sh!==t.sh){t.sh=sh;t.m.setAttribute('transform',sh);t.o.setAttribute('transform',sh)}
  const lit=v<=.004?0:(v>=.985?8:Math.ceil(v*8-1e-6));
  if(lit!==t.lit){t.lit=lit;for(let i=0;i<8;i++)t.segs[i].style.opacity=i<lit?1:0}
  const go=v<=.004?0:(v>=.985?1:+(v*.6).toFixed(3));if(go!==t.go){t.go=go;t.o.style.opacity=go}}
 for(const s of ST){let x=ax[s.ai]||0,y=ax[s.ai+1]||0;const m=Math.hypot(x,y);
  if(m<DZ){x=y=0}else if(m>1){x/=m;y/=m}
  const mg=Math.hypot(x,y),dx=x*TRAVEL,dy=y*TRAVEL,p=(b[s.bi]||0)>.5;
  if(mg>0)act=true;if(p){act=true}
  if(p!==s.p){s.p=p;if(p)press('l3',now)}
  const key=dx.toFixed(1)+','+dy.toFixed(1)+','+p;
  if(key!==s.key){s.key=key;const sc=(1+mg*.035)*(p?.93:1);
   s.g.setAttribute('transform','translate('+(s.cx+dx).toFixed(1)+' '+(s.cy+dy).toFixed(1)+') scale('+sc.toFixed(3)+')');
   s.sh.setAttribute('transform','translate('+(5-dx*.12).toFixed(1)+' '+(10-dy*.12).toFixed(1)+')');
   s.hl.setAttribute('transform','translate('+(-dx*.1).toFixed(1)+' '+(-dy*.1).toFixed(1)+')');
   s.hi.setAttribute('transform','translate('+(dx*.1).toFixed(1)+' '+(dy*.1).toFixed(1)+')');
   const dv=+(mg*.65).toFixed(2);if(dv!==s.dv){s.dv=dv;s.d.style.opacity=dv}}
  const kv=p?1:0;if(kv!==s.kv){s.kv=kv;s.kr.style.opacity=kv}
  // ekor piksel
  if(mg>.1){s.ux+=(x/mg-s.ux)*.25;s.uy+=(y/mg-s.uy)*.25}
  s.amt+=(mg-s.amt)*.35;if(Math.abs(mg-s.amt)<.01)s.amt=mg;
  const vis=s.amt>.12?Math.min(1,s.amt*2.2):0,L=Math.hypot(s.ux,s.uy)||1,ux=s.ux/L,uy=s.uy/L;
  const tk=vis?(Math.round(ux*10)+','+Math.round(uy*10)+','+vis.toFixed(1)):'0';
  if(tk!==s.tk){s.tk=tk;const R4=[58,72,85,96],O4=[.95,.7,.45,.25];
   for(let i=0;i<4;i++){const q=s.tr[i];if(!vis){q.style.opacity=0;continue}
    const px=Math.round((s.cx-ux*R4[i])/6)*6,py=Math.round((s.cy-uy*R4[i])/6)*6;
    q.setAttribute('transform','translate('+px+' '+py+')');q.style.opacity=O4[i]*vis}}}
 if(act)lastAct=now;
 // combo meter
 if(now-lastPress>650)combo=Math.max(0,combo-3*dt);
 dispC+=(combo-dispC)*.3;if(Math.abs(combo-dispC)<.01)dispC=combo;
 const cv=(1-dispC/12).toFixed(3);if(cv!==mcv){mcv=cv;MC.style.transform='scaleY('+cv+')'}
 const full=combo>=11.5;if(full!==mfull){mfull=full;METER.classList.toggle('mfull',full)}
 // display Home
 if(konActive&&now>=konUntil)stopCoins();
 let st='n';
 if(now<lvlUntil)st='l';
 else if(now<konUntil)st=(Math.floor(now/150)%2)?'h':'n';
 else if(now-lastAct>IDLE)st='z';
 else if(trigMax)st='s';
 else if(on.a||on.b||on.x||on.y)st='h';
 setM(st);
 const spd=st==='z'?1.8:(combo>=8?.35:combo>=3?.6:1);
 if(spd!==spdv){spdv=spd;R.setProperty('--spd',spd)}
}
// ---- demo ----
const CYC=11800;
function demo(t){const T=t%CYC,b=new Array(17).fill(0),ax=[0,0,0,0];
 for(let i=0;i<6;i++)if(T>=i*450&&T<(i+1)*450)b[i]=1;
 const tri=(s,i)=>{const u=(T-s)/1200;if(u<0||u>=1)return;b[i]=u<.4?u/.4:u<.65?1:1-(u-.65)/.35};
 tri(2700,6);tri(3900,7);
 for(let i=0;i<4;i++)if(T>=5100+i*500&&T<5100+(i+1)*500)b[12+i]=1;
 if(T>=7100&&T<7400)b[10]=1;if(T>=7400&&T<7700)b[11]=1;
 if(T>=7700&&T<8150)b[8]=1;if(T>=8150&&T<8600)b[9]=1;
 if(T>=8600&&T<11000){const a=(T-8600)/1000*Math.PI*2*1.15,k=Math.min(1,(T-8600)/200);
  ax[0]=Math.cos(a)*k;ax[1]=Math.sin(a)*k;ax[2]=Math.cos(1-a)*k;ax[3]=Math.sin(1-a)*k}
 return{b,ax}}
// ---- sentuh / mouse ----
const vbc={},vtr=[0,0],vtv=[0,0],vax=[0,0,0,0],ptrs=new Map(),K=()=>{const r=svg.getBoundingClientRect();return Math.max(1602/r.width,1080/r.height)};
svg.addEventListener('pointerdown',e=>{const el=e.target.closest&&e.target.closest('[data-in]');if(!el)return;
 e.preventDefault();try{svg.setPointerCapture(e.pointerId)}catch(_){}
 const id=el.id;
 if(id in IDX){const i=IDX[id];vbc[i]=(vbc[i]||0)+1;ptrs.set(e.pointerId,{t:'b',i})}
 else if(id==='tlg'||id==='trg'){const i=id==='tlg'?0:1;vtr[i]++;ptrs.set(e.pointerId,{t:'t',i})}
 else if(id==='ls'||id==='rs'){ptrs.set(e.pointerId,{t:'s',ai:id==='ls'?0:2,bi:id==='ls'?10:11,x0:e.clientX,y0:e.clientY,t0:performance.now(),md:0})}});
svg.addEventListener('pointermove',e=>{const r=ptrs.get(e.pointerId);if(!r||r.t!=='s')return;
 const k=K(),dx=(e.clientX-r.x0)*k,dy=(e.clientY-r.y0)*k;r.md=Math.max(r.md,Math.hypot(dx,dy));
 let x=dx/70,y=dy/70;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}vax[r.ai]=x;vax[r.ai+1]=y});
function up(e){const r=ptrs.get(e.pointerId);if(!r)return;ptrs.delete(e.pointerId);
 if(r.t==='b')vbc[r.i]--;else if(r.t==='t')vtr[r.i]--;
 else{vax[r.ai]=0;vax[r.ai+1]=0;if(r.md<12&&performance.now()-r.t0<240){vbc[r.bi]=(vbc[r.bi]||0)+1;setTimeout(()=>{vbc[r.bi]--},140)}}}
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
document.addEventListener('contextmenu',e=>e.preventDefault());
// ---- loop ----
function pad(){const l=navigator.getGamepads?navigator.getGamepads():[];for(const g of l)if(g&&g.connected)return g;return null}
let lastT=null;
function frame(t){requestAnimationFrame(frame);if(window.__freeze)return;
 if(lastT===null){lastT=t;lastAct=t}
 const dt=Math.min(.1,(t-lastT)/1000);lastT=t;
 for(let i=0;i<2;i++)vtv[i]=Math.max(0,Math.min(1,vtv[i]+(vtr[i]>0?1:-1)*dt/.14));
 let b,ax;
 if(ptrs.size>0||vtv[0]>.004||vtv[1]>.004||(vbc[10]||0)>0||(vbc[11]||0)>0){
  b=new Array(17).fill(0);for(const k in IDX)b[IDX[k]]=(vbc[IDX[k]]||0)>0?1:0;
  b[10]=(vbc[10]||0)>0?1:0;b[11]=(vbc[11]||0)>0?1:0;b[6]=vtv[0];b[7]=vtv[1];ax=vax}
 else{const g=pad();
  if(g){b=new Array(17).fill(0);for(let i=0;i<16;i++){const q=g.buttons[i];if(q)b[i]=(i===6||i===7)?q.value:(q.pressed?1:0)}
   ax=[g.axes[0]||0,g.axes[1]||0,g.axes[2]||0,g.axes[3]||0]}
  else if(DEMO){const d=demo(t);b=d.b;ax=d.ax}
  else{b=[];ax=[0,0,0,0]}}
 draw(b,ax,t,dt)}
setM('n');requestAnimationFrame(frame);
})();
</script></body></html>
