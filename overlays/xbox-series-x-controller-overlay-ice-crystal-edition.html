<script>
const Q=new URLSearchParams(location.search),R=document.documentElement.style,V=document.getElementById('s');
function mix(h,t,a){const n=parseInt(h,16),c=[n>>16&255,n>>8&255,n&255].map(v=>Math.round(v+(t-v)*a));return'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')}
(function(){const TH={ice:'7fe7ff',frost:'a8c8ff',aqua:'4ff3d0',sapphire:'6aa0ff'};
 let a=(Q.get('accent')||TH[Q.get('theme')]||'7fe7ff').replace('#','');if(!/^[0-9a-fA-F]{6}$/.test(a))a='7fe7ff';
 R.setProperty('--acc','#'+a);R.setProperty('--accHi',mix(a,255,.45));R.setProperty('--accLo',mix(a,0,.35));
 if(/^[0-9a-fA-F]{6}$/.test(Q.get('bg')||''))document.body.style.background='#'+Q.get('bg');
 const T=parseFloat(Q.get('tilt'));if(T){document.body.style.perspective='1400px';V.style.transform='rotateX('+T+'deg)'}})();
const IDX={a:0,b:1,x:2,y:3,lb:4,rb:5,view:8,menu:9,du:12,dd:13,dl:14,dr:15};
const $=id=>document.getElementById(id),E={};for(const k in IDX)E[k]=$(k);
const TG={lt:{i:6,p:'tl'},rt:{i:7,p:'tr'}};
for(const k in TG){const t=TG[k],p=t.p;t.m=$(p+'m');t.f=$(p+'f');t.o=$(p+'o');t.g=$(p+'g');t.bs=[...$(p+'b').children];t.bv=[];t.cur=0}
const ST={ls:{cx:346.5,cy:486,ai:0,bi:10},rs:{cx:983,cy:720.5,ai:2,bi:11}};
for(const k in ST){const s=ST[k];s.g=$(k+'c');s.sh=$(k+'s');s.hl=$(k+'h');s.hi=$(k+'i');s.d=$(k+'d');s.k=$(k+'k');s.grad=$('g'+k);s.g1=$(k+'g1');s.g2=$(k+'g2');s.q1x=s.q1y=s.q2x=s.q2y=0}
const TRAVEL=40,DZ=.09,pr={},KO=['du','du','dd','dd','dl','dr','dl','dr','b','a'];
let cnt=0,ki=0,lastIn=0;
const bye=$('bye');
function fx(c,ms){V.classList.remove(c);void V.getBoundingClientRect();V.classList.add(c);setTimeout(()=>V.classList.remove(c),ms)}
function press(k,now){cnt++;
 if(KO[ki]===k)ki++;else ki=KO[0]===k?1:0;
 if(ki===KO.length){ki=0;fx('shatter',1800)}
 if(cnt%100===0)fx('mile',2000)}
function draw(b,ax,now){let act=0;
 for(const k in IDX){const on=(b[IDX[k]]||0)>.5;if(on&&!pr[k])press(k,now);pr[k]=on;E[k].classList.toggle('on',on);if(on)act=1}
 for(const i of[6,7,10,11]){const on=(b[i]||0)>.5;if(on&&!pr[i])press('t'+i,now);pr[i]=on;if(on)act=1}
 $('dc').classList.toggle('on',!!(b[12]||b[13]||b[14]||b[15]));
 for(const k in TG){const t=TG[k],raw=Math.min(1,Math.max(0,b[t.i]||0)),tg=raw<.02?0:raw>=.96?1:raw;
  t.cur+=(tg-t.cur)*.4;if(Math.abs(tg-t.cur)<.003)t.cur=tg;
  const v=t.cur,full=v>=.995,sh='translate(0 '+(v*16).toFixed(2)+')';
  t.f.setAttribute('transform','translate(0 '+((1-v)*265-10).toFixed(1)+')');t.f.style.opacity=v>.004?1:0;
  t.m.setAttribute('transform',sh);t.o.setAttribute('transform',sh);t.o.style.opacity=full?1:v*.6;t.g.classList.toggle('full',full);
  t.bs.forEach((r,i)=>{const o=v>=(i+.5)/8?.34:0;if(t.bv[i]!==o){t.bv[i]=o;r.style.opacity=o}})}
 for(const k in ST){const s=ST[k];let x=ax[s.ai]||0,y=ax[s.ai+1]||0;const m=Math.hypot(x,y);
  if(m<DZ){x=y=0}else if(m>1){x/=m;y/=m}
  const mg=Math.hypot(x,y),dx=x*TRAVEL,dy=y*TRAVEL,p=(b[s.bi]||0)>.5?1:0,sc=(1+mg*.035)*(p?.93:1);if(mg>.2)act=1;
  s.g.setAttribute('transform','translate('+(s.cx+dx)+' '+(s.cy+dy+p*3)+') scale('+sc+')');
  s.sh.setAttribute('transform','translate('+(5-x*7)+' '+(10-y*7)+')');
  s.hl.setAttribute('transform','translate('+(-x*7)+' '+(-y*7)+')');s.hi.setAttribute('transform','translate('+(x*4)+' '+(y*4)+')');
  s.grad.setAttribute('fx',.36-x*.16);s.grad.setAttribute('fy',.3-y*.16);
  s.d.style.opacity=mg*.65;s.k.style.opacity=p;
  s.q1x+=(dx-s.q1x)*.3;s.q1y+=(dy-s.q1y)*.3;s.q2x+=(s.q1x-s.q2x)*.3;s.q2y+=(s.q1y-s.q2y)*.3;
  s.g1.setAttribute('transform','translate('+s.q1x+' '+s.q1y+')');s.g2.setAttribute('transform','translate('+s.q2x+' '+s.q2y+')');
  s.g1.style.opacity=Math.min(.4,Math.hypot(dx-s.q1x,dy-s.q1y)/30*.4);s.g2.style.opacity=Math.min(.25,Math.hypot(dx-s.q2x,dy-s.q2y)/45*.25)}
 if(act)lastIn=now;V.classList.toggle('idle',now-lastIn>8000);
 const ex=ax[0]||0,ey=ax[1]||0,em=Math.hypot(ex,ey),kk=em<DZ?0:Math.min(1,em)/em;
 bye.setAttribute('transform','translate('+(ex*kk*3).toFixed(2)+' '+(ey*kk*2).toFixed(2)+')')}
// demo: semua tombol, trigger, analog (Home tidak pernah). Analog cepat lalu diam.
const SEQ=[0,1,2,3,4,5,12,13,14,15,10,11,8,9],CYC=10080;
function demo(t){const u=t%CYC,b=[],ax=[0,0,0,0];
 if(u<5880)b[SEQ[u/420|0]]=1;
 else if(u<6780)b[6]=Math.sin(Math.PI*(u-5880)/900);
 else if(u<7680)b[7]=Math.sin(Math.PI*(u-6780)/900);
 else if(u<8880){const a=2*Math.PI*(u-7680)/1200;ax[0]=Math.cos(a);ax[1]=Math.sin(a)}
 else if(u<10080){const a=2*Math.PI*(u-8880)/1200;ax[2]=Math.cos(a);ax[3]=Math.sin(a)}
 return[b,ax]}
// sentuh / mouse (multi-touch)
const P=new Map(),TB={},TT={6:0,7:0},TS={ls:null,rs:null},TI={tlg:6,trg:7};
const SEL='#a,#b,#x,#y,#lb,#rb,#view,#menu,#du,#dd,#dl,#dr,#ls,#rs,#tlg,#trg';
const PT=e=>new DOMPoint(e.clientX,e.clientY).matrixTransform(V.getScreenCTM().inverse());
function mv(e,q){const p=PT(e),c=ST[q.id];let x=(p.x-c.cx)/70,y=(p.y-c.cy)/70;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}TS[q.id]=[x,y];if(m>.25)q.m=1}
V.addEventListener('pointerdown',e=>{const g=e.target.closest&&e.target.closest(SEL);if(!g)return;V.setPointerCapture(e.pointerId);
 const id=g.id,q={id,t:performance.now()};P.set(e.pointerId,q);
 if(id==='ls'||id==='rs'){q.k='s';mv(e,q)}else if(TI[id]){q.k='t';TT[TI[id]]=1}else{q.k='b';TB[IDX[id]]=1}e.preventDefault()});
V.addEventListener('pointermove',e=>{const q=P.get(e.pointerId);if(q&&q.k==='s')mv(e,q)});
function up(e){const q=P.get(e.pointerId);if(!q)return;P.delete(e.pointerId);
 if(q.k==='s'){TS[q.id]=null;if(!q.m&&performance.now()-q.t<400){const i=ST[q.id].bi;TB[i]=1;setTimeout(()=>TB[i]=0,130)}}
 else if(q.k==='t')TT[TI[q.id]]=0;else TB[IDX[q.id]]=0}
V.addEventListener('pointerup',up);V.addEventListener('pointercancel',up);
(function loop(t){
 let b=[],ax=[0,0,0,0],pad=null;const pads=navigator.getGamepads?navigator.getGamepads():[];
 for(const g of pads){if(!g||!g.connected)continue;if(g.mapping==='standard'){pad=g;break}pad=pad||g}
 if(pad){b=pad.buttons.map(x=>x.value||(x.pressed?1:0));ax=Array.from(pad.axes)}
 else if(Q.has('demo')&&!P.size){[b,ax]=demo(t)}
 for(const i in TB)if(TB[i])b[i]=1;
 b[6]=Math.max(b[6]||0,TT[6]);b[7]=Math.max(b[7]||0,TT[7]);
 for(const k in TS)if(TS[k]){ax[ST[k].ai]=TS[k][0];ax[ST[k].ai+1]=TS[k][1]}
 draw(b,ax,t);requestAnimationFrame(loop)})(0);
