  const on=raw>.6;if(on!==!!t.on){t.on=on;if(on){hit(k);spin()}}

  t.f.style.opacity=v>.004?1:0;t.f.style.transform=`translateY(${full?0:265-255*v}px)`;

  if(m<DZ){x=y=0}else if(m>1){x/=m;y/=m}
  const mg=Math.hypot(x,y),dx=x*TRAVEL,dy=y*TRAVEL,p=(b[s.bi]||0)>.5?1:0,sc=(1+mg*.035)*(p?.93:1);if(mg>.2)lastIn=n;

  s.sh.setAttribute('transform',`translate(${5-x*7} ${10-y*7})`);s.hl.setAttribute('transform',`translate(${-x*7} ${-y*7})`);s.hi.setAttribute('transform',`translate(${x*4} ${y*4})`);
