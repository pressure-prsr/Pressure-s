.sHi{stop-color:var(--accHi)}.sMid{stop-color:var(--acc)}.sLo{stop-color:var(--accLo)}
.cap,.arm path{transition:transform .05s}
.cap{transform-box:fill-box;transform-origin:center}

.cs{fill:#000;fill-opacity:.4}

.spec{fill:#fff;fill-opacity:.1}
.ring{fill:none;stroke:#fff;stroke-opacity:.1;stroke-width:3}
.glow,.glowp{fill:none;stroke:var(--acc);stroke-width:7;opacity:0;stroke-linejoin:round}
.armp{fill:url(#gArm);stroke:#fff;stroke-opacity:.14;stroke-width:1.5;stroke-linejoin:round}
.armo{fill:url(#gArmOn);opacity:0;stroke:var(--acc);stroke-width:2;stroke-linejoin:round}
text{font:600 52px system-ui,"Segoe UI",Roboto,sans-serif;text-anchor:middle}
.g{fill:#b9c1d0}.gs{fill:#000;fill-opacity:.55}
.i{fill:none;stroke:#b9c1d0;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.p.on .cap{transform:translateY(3px) scale(.965)}
.p.on .dome,.p.on .armp{fill:url(#gDomeOn);stroke:var(--accHi);stroke-opacity:.6}

.p.on .cs{fill-opacity:.18}
.p.on .g,.p.on .i{fill:#3a1565;stroke:#3a1565}.p.on text.g{stroke:none}
.p.on .i{fill:none}
.p.on .gs{fill:#fff;fill-opacity:.4}
.p.on .ring{stroke:#000;stroke-opacity:.25}
.p.on .spec{fill-opacity:.28}
.arm.on path.armp{transform:translateY(2px)}
.arm.on .armo{opacity:1;transform:translateY(2px)}
.tbase{fill:url(#gTrg);stroke:#000;stroke-opacity:.35;stroke-width:2}
.trim{fill:none;stroke:#fff;stroke-opacity:.2;stroke-width:2.5;stroke-linejoin:round}
.tbody{fill:url(#gTrgH);stroke:#000;stroke-opacity:.4;stroke-width:2}
